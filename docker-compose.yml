services:
  rdp:
    build: .
    image: railway-rdp:latest
    container_name: railway-rdp
    ports:
      - "3389:3389"
    environment:
      # 登录用户名
      RDP_USER: rdpuser
      # 登录密码（务必修改）
      RDP_PASSWORD: "ChangeMe_2026!"
      RDP_UID: "1000"
      TZ: Asia/Shanghai

      # ---------- EasyTier 组网（可选，留空则不启用） ----------
      EASYTIER_NETWORK_NAME: "my-rdp-net"
      EASYTIER_NETWORK_SECRET: "ChangeMe_Secret!"
      # 虚拟 IP，客户端用这个地址连 RDP；留空则 DHCP 自动分配
      EASYTIER_IPV4: "10.126.126.10"
      EASYTIER_HOSTNAME: "railway-rdp"
      # 公共共享节点（多个用逗号分隔）；有自建节点就填自建的
      EASYTIER_PEERS: "tcp://public.easytier.cn:11010"
      EASYTIER_LISTENERS: "tcp://0.0.0.0:11010,udp://0.0.0.0:11010"
      # 容器默认跑无 TUN 模式，不需要 /dev/net/tun
      EASYTIER_NO_TUN: "true"
    volumes:
      - rdp_home:/home
    restart: unless-stopped
    # 无 TUN 模式不需要下面两项；若设 EASYTIER_NO_TUN=false 走完整 TUN 模式再打开
    # cap_add:
    #   - NET_ADMIN
    # devices:
    #   - /dev/net/tun:/dev/net/tun

volumes:
  rdp_home:

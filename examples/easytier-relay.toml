# 自建 EasyTier 共享节点（中继）—— 可选
#
# 公共共享节点（public.easytier.cn）是别人提供的，拥塞/稳定性不可控。
# 如果你有一台带公网 IP 的 VPS，强烈建议自建一个，然后把各节点的 [[peer]] 指向它。
#
# 用法：把本文件放到 VPS，然后
#   docker compose -f docker-compose.relay.yml up -d
# 对外开放 11010/tcp 与 11010/udp 防火墙。

instance_name = "relay"
hostname      = "relay"

# 中继节点自己也要一个虚拟 IP
ipv4 = "10.126.126.1"
dhcp = false

listeners = [
  "tcp://0.0.0.0:11010",
  "udp://0.0.0.0:11010",
  "wg://0.0.0.0:11011",
  "ws://0.0.0.0:11011/",
]

mapped_listeners = []
exit_nodes = []

# 想用 easytier-cli 远程查看就把这里改成 0.0.0.0:15888，同时注意防火墙
rpc_portal = "127.0.0.1:15888"

# 中继节点不加入任何具体业务网络，保持默认即可
[network_identity]
network_name   = "default"
network_secret = "default"

[flags]
no_tun            = true    # 中继只做转发，不需要 TUN
enable_encryption = true
enable_ipv6       = true
mtu               = 1380
latency_first     = false
foreign_network_whitelist = "*"
relay_all_peer_rpc = false
disable_udp_hole_punching = false

# EasyTier 配置示例 —— 服务端（Railway 容器里的 RDP 节点）
# 用法：
#   easytier-core -c /etc/easytier/easytier.toml
# 或在容器里设 EASYTIER_EXTRA_ARGS="-c /etc/easytier/easytier.toml"（此时其余 CLI 参数会被配置文件的优先级规则影响，推荐二选一）
#
# 注意：容器内通常没有 /dev/net/tun，必须 no_tun = true。
#       无 TUN 模式下本节点「可以被虚拟 IP 访问」，但不能主动访问其他节点——
#       作为 RDP 服务端正好够用。

instance_name = "railway-rdp"
hostname      = "railway-rdp"

# 固定虚拟 IP；想让 EasyTier 自动分配就删掉这行并把 dhcp 改成 true
ipv4 = "10.126.126.10"
dhcp = false

# 监听端口（公网不可达也没关系，只是少一条被直连的链路）
listeners = [
  "tcp://0.0.0.0:11010",
  "udp://0.0.0.0:11010",
]

mapped_listeners = []
exit_nodes = []

# 管理端口，只监听本地，给 easytier-cli 用
rpc_portal = "127.0.0.1:15888"

# 组网凭据：所有节点必须一致
[network_identity]
network_name   = "my-rdp-net"
network_secret = "ChangeMe_Secret!"

# 初始连接的对端（公共共享节点 / 自建节点），可写多个 [[peer]] 块
[[peer]]
uri = "tcp://public.easytier.cn:11010"

[flags]
no_tun         = true      # 无 TUN 模式：免 /dev/net/tun、免 root 建网卡
enable_encryption = true
enable_ipv6    = false
mtu            = 1380
latency_first  = false
disable_p2p    = false
relay_all_peer_rpc = false
disable_udp_hole_punching = false

# GitHub Actions: Debian SSH over EasyTier
# 放到 .github/workflows/debian+geasytier.yml
#
# Secrets (Settings - Secrets and variables - Actions):
#   EASYTIER_NETWORK_NAME     必填
#   EASYTIER_NETWORK_SECRET   必填
#   EASYTIER_PEER             可选。支持多个 -p，例如:
#                             -p tcp://1.2.3.4:11010 -p udp://1.2.3.4:11010 -p tcp://example.com:11010
#                             留空则用 tcp://public.easytier.cn:11010
#
# Google Drive 挂载（挂载到 /home/NvdAdmin/GoogleDrive，完整读写）:
#   RCLONE_CONF               推荐。完整的 rclone.conf 内容（明文）
#   或 RCLONE_TOKEN           仅 token JSON（自动生成 [gdrive] 段）
#   RCLONE_DRIVE_CLIENT_ID    可选。自定义 OAuth client_id
#   RCLONE_DRIVE_CLIENT_SECRET 可选。自定义 OAuth client_secret
#
# 连接: ssh NvdAdmin@<EasyTier IP>
# 密码: P@ssw0rd1qazXSW@#

name: Debian SSH geasytier

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: debian:bookworm
      options: --privileged --cap-add=NET_ADMIN

    steps:
      - name: 1. Install SSH and base packages
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends openssh-server sudo curl ca-certificates unzip iproute2 procps iptables openssl
          mkdir -p /run/sshd /dev/net
          if [ ! -c /dev/net/tun ]; then mknod /dev/net/tun c 10 200; chmod 666 /dev/net/tun; fi
          ssh-keygen -A
          printf '%s\n' 'PasswordAuthentication yes' 'PermitRootLogin yes' 'UseDNS no' 'ClientAliveInterval 30' 'ClientAliveCountMax 120' >> /etc/ssh/sshd_config
          echo 'root:P@ssw0rd1qazXSW@#' | chpasswd
          id NvdAdmin >/dev/null 2>&1 || useradd -m -s /bin/bash NvdAdmin
          echo 'NvdAdmin:P@ssw0rd1qazXSW@#' | chpasswd
          usermod -aG sudo NvdAdmin
          echo 'NvdAdmin ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/NvdAdmin
          chmod 440 /etc/sudoers.d/NvdAdmin
          /usr/sbin/sshd
          echo 'SSH ready.'

      - name: 2. Install and Connect EasyTier
        shell: bash
        env:
          EASYTIER_NETWORK_NAME: ${{ secrets.EASYTIER_NETWORK_NAME }}
          EASYTIER_NETWORK_SECRET: ${{ secrets.EASYTIER_NETWORK_SECRET }}
          EASYTIER_PEER: ${{ secrets.EASYTIER_PEER }}
        run: |
          set -uo pipefail
          install_root=/opt/easytier
          log_dir=/var/log/easytier
          config_path=$install_root/config.toml
          mkdir -p "$install_root" "$log_dir"

          dump_logs() {
            echo '----- logs -----'
            ls -l "$log_dir" 2>/dev/null || true
            for f in "$log_dir"/*; do
              [ -f "$f" ] || continue
              echo "----- $f -----"
              tail -n 80 "$f" || true
            done
            if [ -f "$config_path" ]; then
              echo '----- config.toml (redacted) -----'
              sed -E 's/(network_name|network_secret) *=.*/\1 = ***/' "$config_path" || true
            fi
          }

          fail() { echo "$1" >&2; dump_logs; exit 1; }

          strip_wrap() {
            s=$1
            s=${s#"${s%%[![:space:]]*}"}
            s=${s%"${s##*[![:space:]]}"}
            case "$s" in
              \"*\") s=${s#\"}; s=${s%\"} ;;
              \'*\') s=${s#\'}; s=${s%\'} ;;
            esac
            printf '%s' "$s"
          }

          escape_toml() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }

          net_name=$(strip_wrap "${EASYTIER_NETWORK_NAME:-}")
          net_secret=$(strip_wrap "${EASYTIER_NETWORK_SECRET:-}")
          peer_raw=$(strip_wrap "${EASYTIER_PEER:-}")
          echo "secret name len=${#net_name} secret len=${#net_secret} peer raw len=${#peer_raw}"
          if [ -z "$net_name" ] || [ -z "$net_secret" ]; then
            fail 'Missing EASYTIER_NETWORK_NAME or EASYTIER_NETWORK_SECRET in repository secrets.'
          fi

          peer_list=()
          while IFS= read -r u; do
            [ -n "$u" ] || continue
            u=${u%/}
            case "$u" in
              *:[0-9]|*:[0-9][0-9]|*:[0-9][0-9][0-9]|*:[0-9][0-9][0-9][0-9]|*:[0-9][0-9][0-9][0-9][0-9]) ;;
              *) u="${u}:11010" ;;
            esac
            peer_list+=("$u")
          done < <(printf '%s\n' "$peer_raw" | grep -oE '(tcp|udp|ws|wss|wg|quic)://[^[:space:],;]+' || true)

          if [ ${#peer_list[@]} -eq 0 ]; then
            peer_list=('tcp://public.easytier.cn:11010')
            echo 'EASYTIER_PEER empty or invalid, using public node'
          fi
          echo "parsed peer count=${#peer_list[@]}"
          for u in "${peer_list[@]}"; do echo "  peer len=${#u}"; done

          version=v2.6.4
          zip_path=/tmp/easytier.zip
          url="https://github.com/EasyTier/EasyTier/releases/download/${version}/easytier-linux-x86_64-${version}.zip"
          echo "Downloading EasyTier ${version}"
          curl -L --fail --retry 3 --retry-delay 2 -o "$zip_path" "$url"
          sz=$(stat -c%s "$zip_path")
          if [ "$sz" -lt 1000000 ]; then fail "Download too small: $sz"; fi
          extract_dir=/tmp/easytier-extract
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          unzip -o "$zip_path" -d "$extract_dir"
          core=$(find "$extract_dir" -type f -name easytier-core | head -n1)
          [ -n "$core" ] || fail 'easytier-core not found after extract'
          cp -a "$(dirname "$core")/." "$install_root/"
          chmod +x "$install_root/easytier-core" "$install_root/easytier-cli"
          "$install_root/easytier-core" --version || true

          {
            echo 'hostname = "github-debian-server"'
            echo 'dhcp = true'
            echo 'rpc_portal = "127.0.0.1:15888"'
            echo 'listeners = ["tcp://0.0.0.0:11010", "udp://0.0.0.0:11010"]'
            echo
            echo '[network_identity]'
            printf 'network_name = "%s"\n' "$(escape_toml "$net_name")"
            printf 'network_secret = "%s"\n' "$(escape_toml "$net_secret")"
            echo
            for u in "${peer_list[@]}"; do
              echo '[[peer]]'
              printf 'uri = "%s"\n' "$(escape_toml "$u")"
              echo
            done
          } > "$config_path"
          echo "Wrote $config_path"

          start_et() {
            pkill -9 easytier-core 2>/dev/null || true
            sleep 1
            : > "$log_dir/stdout.log"
            : > "$log_dir/stderr.log"
            nohup "$install_root/easytier-core" --config-file "$config_path" --file-log-dir "$log_dir" --file-log-level info >"$log_dir/stdout.log" 2>"$log_dir/stderr.log" &
            echo $! > /var/run/easytier.pid
            sleep 4
          }

          start_et
          pgrep -x easytier-core >/dev/null || fail 'easytier-core exited immediately'

          et_ip=
          for i in $(seq 1 40); do
            sleep 3
            pgrep -x easytier-core >/dev/null || fail "easytier-core died while waiting for IP, round $i"
            node_out=$("$install_root/easytier-cli" --rpc-portal 127.0.0.1:15888 node 2>&1 || true)
            peer_out=$("$install_root/easytier-cli" --rpc-portal 127.0.0.1:15888 peer 2>&1 || true)
            echo "[$i/40] node output:"
            echo "$node_out"
            if [ "$i" -eq 1 ] || [ $((i % 5)) -eq 0 ]; then echo "peer output:"; echo "$peer_out"; fi
            cand=$(printf '%s\n' "$node_out" | sed -n 's/.*Virtual IP[[:space:]]*|[[:space:]]*\([0-9.]*\).*/\1/p' | head -n1)
            if [ -n "$cand" ] && [ "$cand" != "0.0.0.0" ]; then et_ip=$cand; break; fi
            cand=$(printf '%s\n' "$peer_out" | sed -n 's/.*\([0-9]\+\.[0-9]\+\.[0-9]\+\.[0-9]\+\)[[:space:]]*|[[:space:]]*github-debian-server.*/\1/p' | head -n1)
            if [ -n "$cand" ]; then et_ip=$cand; break; fi
            cand=$(ip -4 -o addr show 2>/dev/null | awk '/ tun| easytier| et_/ {print $4}' | cut -d/ -f1 | awk '/^10\./{print; exit}')
            if [ -n "$cand" ]; then et_ip=$cand; break; fi
          done
          [ -n "$et_ip" ] || fail 'Timed out waiting for EasyTier virtual IP. Check peers and network name/secret.'

          echo
          echo '=========================================='
          echo '  DEBIAN SSH SERVER IS READY'
          echo "  EasyTier IP  : $et_ip"
          echo '  Username     : NvdAdmin'
          echo '  Password     : P@ssw0rd1qazXSW@#'
          echo "  ssh command  : ssh NvdAdmin@$et_ip"
          echo '=========================================='

      - name: 2.5 Install and Mount Google Drive to ~/GoogleDrive
        shell: bash
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          RCLONE_TOKEN: ${{ secrets.RCLONE_TOKEN }}
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          # 安装依赖
          apt-get update
          apt-get install -y --no-install-recommends fuse3 curl unzip ca-certificates
          # 容器里经常没有 /dev/fuse
          if [ ! -c /dev/fuse ]; then
            mknod /dev/fuse c 10 229 || true
            chmod 666 /dev/fuse || true
          fi
          if [ -f /etc/fuse.conf ] && ! grep -qE '^[[:space:]]*user_allow_other' /etc/fuse.conf; then
            echo 'user_allow_other' >> /etc/fuse.conf
          fi

          # 安装最新官方 rclone（Debian 仓库版太旧）
          if ! command -v rclone >/dev/null || rclone version 2>/dev/null | head -1 | grep -qE 'v1\.(0[0-9]|[1-5][0-9]|6[0-4])\.'; then
            arch=$(dpkg --print-architecture)
            case "$arch" in
              amd64) rarch=linux-amd64 ;;
              arm64) rarch=linux-arm64 ;;
              *) rarch=linux-amd64 ;;
            esac
            tmp=$(mktemp -d)
            curl -fsSL "https://downloads.rclone.org/rclone-current-${rarch}.zip" -o "$tmp/rclone.zip"
            unzip -qo "$tmp/rclone.zip" -d "$tmp"
            install -m 0755 "$(find "$tmp" -type f -name rclone | head -1)" /usr/local/bin/rclone
            rm -rf "$tmp"
          fi
          rclone version | head -1

          # 配置文件放到 NvdAdmin 家目录
          USER_HOME=/home/NvdAdmin
          mkdir -p "$USER_HOME/.config/rclone" "$USER_HOME/GoogleDrive" "$USER_HOME/.cache/rclone-gdrive"
          conf="$USER_HOME/.config/rclone/rclone.conf"

          if [ -n "${RCLONE_CONF:-}" ]; then
            # 优先使用完整配置
            printf '%s\n' "$RCLONE_CONF" > "$conf"
          elif [ -n "${RCLONE_TOKEN:-}" ]; then
            # 仅 token 时自动生成最小配置
            cat > "$conf" <<EOF
          [gdrive]
          type = drive
          scope = drive
          token = ${RCLONE_TOKEN}
          EOF
            if [ -n "${RCLONE_DRIVE_CLIENT_ID:-}" ] && [ -n "${RCLONE_DRIVE_CLIENT_SECRET:-}" ]; then
              cat >> "$conf" <<EOF
          client_id = ${RCLONE_DRIVE_CLIENT_ID}
          client_secret = ${RCLONE_DRIVE_CLIENT_SECRET}
          EOF
            fi
          else
            echo "ERROR: 请至少设置 Secret RCLONE_CONF 或 RCLONE_TOKEN" >&2
            exit 1
          fi
          chown -R NvdAdmin:NvdAdmin "$USER_HOME/.config" "$USER_HOME/GoogleDrive" "$USER_HOME/.cache"
          chmod 600 "$conf"

          # 验证能否访问
          if ! sudo -u NvdAdmin env HOME="$USER_HOME" rclone lsd gdrive: --max-depth 1 --retries 2; then
            echo "ERROR: rclone 无法访问 gdrive，请检查 token/配置" >&2
            exit 1
          fi

          # 后台挂载（完整读写 + VFS 缓存）
          nohup sudo -u NvdAdmin env HOME="$USER_HOME" \
            rclone mount gdrive: "$USER_HOME/GoogleDrive" \
              --config "$conf" \
              --vfs-cache-mode full \
              --vfs-cache-max-size 5G \
              --vfs-cache-max-age 72h \
              --dir-cache-time 1h \
              --poll-interval 1m \
              --umask 022 \
              --allow-non-empty \
              --cache-dir "$USER_HOME/.cache/rclone-gdrive" \
              > /tmp/gdrive-rclone.log 2>&1 &

          # 等待挂载成功
          for i in $(seq 1 30); do
            if findmnt -n "$USER_HOME/GoogleDrive" >/dev/null 2>&1 || grep -q " $USER_HOME/GoogleDrive " /proc/mounts; then
              echo "Google Drive 已挂载到 $USER_HOME/GoogleDrive"
              ls -la "$USER_HOME/GoogleDrive" | head -15
              exit 0
            fi
            sleep 1
          done
          echo "挂载超时，日志：" >&2
          tail -n 50 /tmp/gdrive-rclone.log || true
          exit 1

      - name: 3. Keep Server Alive
        shell: bash
        run: |
          install_root=/opt/easytier
          log_dir=/var/log/easytier
          config_path=$install_root/config.toml
          MOUNT_DIR=/home/NvdAdmin/GoogleDrive
          for i in $(seq 1 360); do
            if ! pgrep -x easytier-core >/dev/null; then
              echo "[$i/360] easytier-core stopped, restarting"
              nohup "$install_root/easytier-core" --config-file "$config_path" --file-log-dir "$log_dir" --file-log-level info >>"$log_dir/stdout.log" 2>>"$log_dir/stderr.log" &
            else
              echo "[$i/360] Server running, pid=$(pgrep -x easytier-core | head -n1)"
            fi
            if ! pgrep -x sshd >/dev/null; then echo 'sshd stopped, restarting'; /usr/sbin/sshd || true; fi

            # 守护 Google Drive 挂载
            if ! findmnt -n "$MOUNT_DIR" >/dev/null 2>&1; then
              echo "[$i/360] Google Drive 未挂载，尝试重新挂载"
              nohup sudo -u NvdAdmin env HOME=/home/NvdAdmin \
                rclone mount gdrive: "$MOUNT_DIR" \
                  --config /home/NvdAdmin/.config/rclone/rclone.conf \
                  --vfs-cache-mode full \
                  --vfs-cache-max-size 5G \
                  --allow-non-empty \
                  --cache-dir /home/NvdAdmin/.cache/rclone-gdrive \
                  > /tmp/gdrive-rclone.log 2>&1 &
            fi
            sleep 60
          done

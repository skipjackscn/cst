name: One-time Debian SSH 2222 fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_fix-debian-ssh.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch debian.yml and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/debian.yml')
          s = p.read_text(encoding='utf-8')

          old = '''              'runcmd:',
              '  - [systemctl, enable, --now, ssh]',
              '',
          ])'''
          new = '''              'runcmd:',
              '  - [systemctl, enable, --now, ssh]',
              '  - [bash, -c, "mkdir -p /etc/ssh/sshd_config.d && printf %s\\\\n \\\"Port 22\\nPort 2222\\nListenAddress 0.0.0.0\\nListenAddress ::\\nPasswordAuthentication yes\\nPermitRootLogin no\\\" > /etc/ssh/sshd_config.d/99-cst-ssh.conf"]',
              '  - [bash, -c, "sshd -t"]',
              '  - [systemctl, restart, ssh]',
              '',
          ])'''
          if old not in s:
              raise SystemExit('cloud-init runcmd block not found')
          s = s.replace(old, new, 1)

          old2 = "              'apt-get install -y --no-install-recommends iptables iproute2 unzip jq ca-certificates curl iputils-ping',"
          new2 = '''              'apt-get install -y --no-install-recommends iptables iproute2 unzip jq ca-certificates curl iputils-ping openssh-server',
              '',
              '# Make SSH reachable directly through EasyTier at 10.1.1.51:2222.',
              'mkdir -p /etc/ssh/sshd_config.d',
              "printf '%s\\n' 'Port 22\\nPort 2222\\nListenAddress 0.0.0.0\\nListenAddress ::\\nPasswordAuthentication yes\\nPermitRootLogin no' > /etc/ssh/sshd_config.d/99-cst-ssh.conf",
              'sshd -t',
              'systemctl enable --now ssh',
              'systemctl restart ssh',
              '',
              '# Allow SSH on the EasyTier interface even when a host firewall is enabled.',
              'iptables -C INPUT -p tcp --dport 2222 -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -p tcp --dport 2222 -j ACCEPT',
              'iptables -C INPUT -i et0 -p tcp --dport 2222 -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -i et0 -p tcp --dport 2222 -j ACCEPT','''
          if old2 not in s:
              raise SystemExit('EasyTier apt install line not found')
          s = s.replace(old2, new2, 1)

          old3 = '''          echo '===== config.toml flags ====='
          grep -Eq '^enable_exit_node = true' "$ET/config.toml"'''
          new3 = '''          echo '===== SSH 2222 ====='
          sshd -t
          ss -lntp | grep -Eq ':2222[[:space:]]'
          iptables -C INPUT -p tcp --dport 2222 -j ACCEPT
          echo 'SSH TCP/2222 + firewall rule  [OK]'

          echo '===== config.toml flags ====='
          grep -Eq '^enable_exit_node = true' "$ET/config.toml"'''
          if old3 not in s:
              raise SystemExit('verify insertion point not found')
          s = s.replace(old3, new3, 1)

          p.write_text(s, encoding='utf-8')
          print('patched', p)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/debian.yml
          git rm .github/workflows/_fix-debian-ssh.yml
          git commit -m 'fix: expose Debian SSH on EasyTier port 2222'
          git push
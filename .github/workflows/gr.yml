name: Debian KVM EasyTier grok

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debian-kvm-easytier
  cancel-in-progress: true

env:
  VM_USER: NvdAdmin
  VM_HOSTNAME: debian-kvm
  HOST_SSH_PORT: '2222'
  ET_HOSTNAME: gh-et
  ET_IPV4: '10.1.1.51/24'
  ET_VERSION: latest
  KEEP_ALIVE_MINUTES: '330'

jobs:
  debian-kvm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ET_NETWORK_NAME: ${{ secrets.EASYTIER_NETWORK_NAME }}
      ET_NETWORK_SECRET: ${{ secrets.EASYTIER_NETWORK_SECRET }}
      ET_PEER: ${{ secrets.EASYTIER_PEER }}
      VM_PASSWORD: ${{ secrets.DEBIAN_ROOT_PASSWORD }}

    steps:
      - name: Prepare runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils sshpass curl ca-certificates jq unzip openssl
          test -e /dev/kvm || echo '::warning::/dev/kvm not available; QEMU will use TCG'
          sudo chmod 0666 /dev/kvm 2>/dev/null || true
          WORK_DIR=/mnt/cst-debian-vm
          sudo mkdir -p "$WORK_DIR"
          sudo chown "$USER:$USER" "$WORK_DIR"
          echo "WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"
          echo "VM_CPUS=$(nproc)" >> "$GITHUB_ENV"
          MEM_MB=$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)
          [ "$MEM_MB" -gt 4096 ] && MEM_MB=$((MEM_MB-1536))
          echo "VM_MEM=${MEM_MB}" >> "$GITHUB_ENV"
          [ -n "${ET_NETWORK_NAME:-}" ] && [ -n "${ET_NETWORK_SECRET:-}" ] || { echo '::error::EASYTIER_NETWORK_NAME and EASYTIER_NETWORK_SECRET are required'; exit 1; }

      - name: Download Debian and EasyTier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          curl -fL --retry 5 -o debian.qcow2 'https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2'
          qemu-img resize debian.qcow2 20G
          JSON=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/EasyTier/EasyTier/releases/latest)
          ET_URL=$(printf '%s' "$JSON" | jq -r '.assets[].browser_download_url' | grep -E 'easytier-linux-x86_64-v?.*\.zip$' | grep -v -E 'gui|sha256' | head -n1)
          [ -n "$ET_URL" ] || { echo '::error::EasyTier x86_64 release asset not found'; exit 1; }
          curl -fL --retry 5 -o easytier.zip "$ET_URL"
          echo "ET_TAG=$(printf '%s' "$JSON" | jq -r '.tag_name')" >> "$GITHUB_ENV"

      - name: Build cloud-init and EasyTier config
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          PASS="${VM_PASSWORD:-}"
          if [ -z "$PASS" ]; then PASS=$(openssl rand -base64 18); fi
          printf '%s' "$PASS" > .vm_password
          chmod 600 .vm_password
          export HASH="$(openssl passwd -6 "$PASS")"
          python3 - <<'PY'
          import os, pathlib, re, textwrap
          p=pathlib.Path('.')
          user=os.environ.get('VM_USER','NvdAdmin')
          host=os.environ.get('VM_HOSTNAME','debian-kvm')
          h=os.environ['HASH']
          ud=textwrap.dedent(f'''\
          #cloud-config
          hostname: {host}
          fqdn: {host}
          manage_etc_hosts: true
          ssh_pwauth: true
          disable_root: true
          users:
            - name: {user}
              groups: [sudo]
              shell: /bin/bash
              sudo: ALL=(ALL) NOPASSWD:ALL
              lock_passwd: false
              passwd: "{h}"
          runcmd:
            - [systemctl, enable, --now, ssh]
          ''')
          p.joinpath('user-data').write_text(ud)
          p.joinpath('meta-data').write_text('instance-id: cst-debian-kvm\nlocal-hostname: '+host+'\n')
          esc=lambda x: (x or '').replace('\\','\\\\').replace('"','\\"')
          name=esc(os.environ['ET_NETWORK_NAME'])
          secret=esc(os.environ['ET_NETWORK_SECRET'])
          peer=os.environ.get('ET_PEER','')
          peers=re.findall(r'(?:tcp|udp|ws|wss|wg|quic)://[^\\s,;]+',peer) or ['tcp://public.easytier.cn:11010']
          pl=[]
          for x in peers:
              x=x.rstrip('/')
              if not re.search(r':\\d+$',x): x += ':11010'
              pl += ['[[peer]]',f'uri = "{esc(x)}"','']
          cfg=['instance_name = "default"','hostname = "gh-et"','dhcp = false','ipv4 = "10.1.1.51/24"','rpc_portal = "127.0.0.1:15888"','exit_nodes = []','','listeners = [','  "tcp://0.0.0.0:11010",','  "udp://0.0.0.0:11010",','  "wg://0.0.0.0:11011",',']','','[network_identity]',f'network_name = "{name}"',f'network_secret = "{secret}"','']+pl+['[flags]','dev_name = "et0"','enable_exit_node = true','use_smoltcp = false','proxy_forward_by_system = true','relay_network_whitelist = "*"','foreign_network_whitelist = "*"','private_mode = false','latency_first = true','multi_thread = true','enable_encryption = true','enable_ipv6 = false','no_tun = false','']
          p.joinpath('config.toml').write_text('\n'.join(cfg)); p.joinpath('config.toml').chmod(0o600)
          PY
          cloud-localds seed.iso user-data meta-data

      - name: Start QEMU KVM
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          if [ -w /dev/kvm ]; then ACCEL=(-machine q35,accel=kvm -enable-kvm -cpu host); else ACCEL=(-machine q35 -cpu max); fi
          nohup qemu-system-x86_64 "${ACCEL[@]}" -name "$VM_HOSTNAME" -smp "$VM_CPUS" -m "$VM_MEM" -drive file=debian.qcow2,format=qcow2,if=virtio -drive file=seed.iso,format=raw,if=virtio,readonly=on -netdev user,id=n0,hostfwd=tcp::${HOST_SSH_PORT}-:22 -device virtio-net-pci,netdev=n0 -display none -serial file:serial.log >qemu.log 2>&1 &
          echo $! > qemu.pid

      - name: Wait for initial SSH
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          P=$(cat .vm_password)
          for i in $(seq 1 120); do
            if sshpass -p "$P" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -p "$HOST_SSH_PORT" "$VM_USER@127.0.0.1" 'echo ready' 2>/dev/null; then exit 0; fi
            sleep 5
          done
          tail -100 qemu.log || true
          tail -100 serial.log || true
          exit 1

      - name: Install EasyTier and expose SSH 2222
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          P=$(cat .vm_password)
          ssh_cmd=(sshpass -p "$P" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -p "$HOST_SSH_PORT" "$VM_USER@127.0.0.1")
          scp_cmd=(sshpass -p "$P" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "$HOST_SSH_PORT")
          cat > install.sh <<'SH'
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends iptables iproute2 unzip ca-certificates curl iputils-ping openssh-server
          sudo install -d -m 0755 /opt/easytier
          sudo unzip -o -j /tmp/easytier.zip -d /opt/easytier
          sudo chmod +x /opt/easytier/easytier-*
          sudo install -m 0600 /tmp/config.toml /opt/easytier/config.toml
          sudo tee /etc/ssh/sshd_config.d/99-cst-ssh.conf >/dev/null <<'EOF'
          Port 22
          Port 2222
          ListenAddress 0.0.0.0
          ListenAddress ::
          PasswordAuthentication yes
          PermitRootLogin no
          EOF
          sudo sshd -t
          sudo systemctl enable --now ssh
          sudo systemctl restart ssh
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv4.conf.all.rp_filter=0
          sudo tee /etc/sysctl.d/99-cst-easytier.conf >/dev/null <<'EOF'
          net.ipv4.ip_forward=1
          net.ipv4.conf.all.rp_filter=0
          net.ipv4.conf.default.rp_filter=0
          EOF
          sudo tee /etc/systemd/system/easytier.service >/dev/null <<'EOF'
          [Unit]
          After=network-online.target
          Wants=network-online.target
          [Service]
          ExecStartPre=-/sbin/modprobe tun
          ExecStart=/opt/easytier/easytier-core --config-file /opt/easytier/config.toml
          Restart=always
          RestartSec=3
          LimitNOFILE=1048576
          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl enable --now easytier
          for i in $(seq 1 60); do ip link show et0 >/dev/null 2>&1 && break; sleep 2; done
          OUT=$(ip route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="dev"){print $(i+1);exit}}')
          sudo iptables -C INPUT -p tcp --dport 2222 -j ACCEPT 2>/dev/null || sudo iptables -I INPUT 1 -p tcp --dport 2222 -j ACCEPT
          sudo iptables -C INPUT -i et0 -p tcp --dport 2222 -j ACCEPT 2>/dev/null || sudo iptables -I INPUT 1 -i et0 -p tcp --dport 2222 -j ACCEPT
          sudo iptables -C FORWARD -i et0 -o "$OUT" -j ACCEPT 2>/dev/null || sudo iptables -I FORWARD 1 -i et0 -o "$OUT" -j ACCEPT
          sudo iptables -C FORWARD -i "$OUT" -o et0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || sudo iptables -I FORWARD 1 -i "$OUT" -o et0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          sudo iptables -t nat -C POSTROUTING -o "$OUT" -j MASQUERADE 2>/dev/null || sudo iptables -t nat -A POSTROUTING -o "$OUT" -j MASQUERADE
          SH
          "${scp_cmd[@]}" easytier.zip config.toml "$VM_USER@127.0.0.1:/tmp/"
          "${scp_cmd[@]}" install.sh "$VM_USER@127.0.0.1:/tmp/install.sh"
          "${ssh_cmd[@]}" 'sudo bash /tmp/install.sh'

      - name: Verify EasyTier exit node and SSH 2222
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          P=$(cat .vm_password)
          sshpass -p "$P" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$HOST_SSH_PORT" "$VM_USER@127.0.0.1" 'sudo bash -s' <<'SH'
          set -e
          systemctl is-active --quiet easytier
          ip -4 addr show et0 | grep -q '10.1.1.51'
          ss -lnt | grep -Eq ':2222[[:space:]]'
          iptables -C INPUT -p tcp --dport 2222 -j ACCEPT
          test "$(cat /proc/sys/net/ipv4/ip_forward)" = 1
          iptables -t nat -S | grep -q MASQUERADE
          echo 'EasyTier exit-node + 10.1.1.51:2222 SSH + NAT: OK'
          SH

      - name: Keep VM alive
        shell: bash
        run: |
          echo "Debian 13 QEMU/KVM + EasyTier exit node is ready."
          echo "SSH: ssh -p 2222 ${VM_USER}@10.1.1.51"
          sleep "${KEEP_ALIVE_MINUTES}m"

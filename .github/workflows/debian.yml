name: Debian 13 QEMU/KVM + EasyTier (exit-node)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debian-kvm-easytier
  cancel-in-progress: true

env:
  VM_USER: root
  VM_HOSTNAME: debian-kvm
  HOST_SSH_PORT: '2222'
  ET_HOSTNAME: gh-et
  ET_IPV4: '10.1.1.51/24'
  KEEP_ALIVE_MINUTES: '330'

jobs:
  debian-kvm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ET_NETWORK_NAME: ${{ secrets.EASYTIER_NETWORK_NAME }}
      ET_NETWORK_SECRET: ${{ secrets.EASYTIER_NETWORK_SECRET }}
      ET_PEER: ${{ secrets.EASYTIER_PEER }}

    steps:
      - name: Prepare runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils sshpass curl ca-certificates jq unzip openssl
          sudo chmod 0666 /dev/kvm 2>/dev/null || true
          WORK_DIR=/mnt/cst-debian-vm
          sudo mkdir -p "$WORK_DIR"
          sudo chown "$USER:$USER" "$WORK_DIR"
          echo "WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"
          echo "VM_CPUS=$(nproc)" >> "$GITHUB_ENV"
          MEM_MB=$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)
          [ "$MEM_MB" -gt 4096 ] && MEM_MB=$((MEM_MB-1536))
          echo "VM_MEM=$MEM_MB" >> "$GITHUB_ENV"
          [ -n "${ET_NETWORK_NAME:-}" ] && [ -n "${ET_NETWORK_SECRET:-}" ] || { echo '::error::EASYTIER_NETWORK_NAME and EASYTIER_NETWORK_SECRET are required'; exit 1; }

      - name: Download Debian and EasyTier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          curl -fL --retry 5 -o debian.qcow2 'https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2'
          qemu-img resize debian.qcow2 20G
          JSON=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/EasyTier/EasyTier/releases/latest)
          ET_URL=$(printf '%s' "$JSON" | jq -r '.assets[].browser_download_url' | grep -E '/easytier-linux-x86_64-v[0-9][^/]*\.zip$' | grep -v -E 'gui|sha256' | head -n1 || true)
          if [ -z "$ET_URL" ]; then
            ET_TAG=$(printf '%s' "$JSON" | jq -r '.tag_name')
            ET_URL="https://github.com/EasyTier/EasyTier/releases/download/${ET_TAG}/easytier-linux-x86_64-${ET_TAG}.zip"
          fi
          echo "EasyTier URL: $ET_URL"
          curl -fL --retry 5 -o easytier.zip "$ET_URL"
          unzip -l easytier.zip | head -30

      - name: Build cloud-init and EasyTier config
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          python3 - <<'PY'
          import ipaddress
          import os
          import pathlib
          import re
          import textwrap
          from urllib.parse import urlsplit, urlunsplit

          p = pathlib.Path('.')
          host = os.environ.get('VM_HOSTNAME', 'debian-kvm')

          ssh_conf = textwrap.dedent('''\
          Port 22
          Port 2222
          ListenAddress 0.0.0.0
          ListenAddress ::
          PasswordAuthentication yes
          PermitEmptyPasswords yes
          PermitRootLogin yes
          PubkeyAuthentication yes
          UsePAM yes
          ''')

          ud = textwrap.dedent(f'''\
          #cloud-config
          hostname: {host}
          fqdn: {host}
          manage_etc_hosts: true
          ssh_pwauth: true
          disable_root: false
          users:
            - name: root
              lock_passwd: false
              shell: /bin/bash
              groups: [root]
          chpasswd:
            expire: false
            users:
              - name: root
                password: ''
                type: text
          write_files:
            - path: /etc/ssh/sshd_config.d/99-cst-root-ssh.conf
              permissions: '0644'
              owner: root:root
              content: |
          {textwrap.indent(ssh_conf, '                ')}
          runcmd:
            - [bash, -c, "passwd -d root || true; passwd -u root || true"]
            - [sshd, -t]
            - [systemctl, enable, --now, ssh]
            - [systemctl, restart, ssh]
          ''')
          p.joinpath('user-data').write_text(ud)
          p.joinpath('meta-data').write_text(
              'instance-id: cst-debian-kvm\nlocal-hostname: ' + host + '\n'
          )

          def esc(value):
              return (value or '').replace('\\', '\\\\').replace('"', '\\"')

          def split_peers(raw):
              return [x for x in re.split(r'\s+|[,;]+', (raw or '').strip()) if x]

          def normalize_peer(raw):
              x = raw.strip()
              if not x:
                  return None
              if '://' in x:
                  u = urlsplit(x)
                  if u.scheme.lower() not in {'tcp', 'udp', 'wg', 'ws', 'wss'}:
                      raise ValueError(f'unsupported EasyTier peer scheme: {u.scheme!r}')
                  if not u.hostname:
                      raise ValueError(f'invalid EasyTier peer URI: {x!r}')
                  try:
                      port = u.port
                  except ValueError as exc:
                      raise ValueError(f'invalid EasyTier peer port in {x!r}') from exc
                  if port is None:
                      port = 11010
                  if not 1 <= port <= 65535:
                      raise ValueError(f'EasyTier peer port out of range: {port}')
                  host_part = u.hostname
                  if ':' in host_part and not host_part.startswith('['):
                      host_part = f'[{host_part}]'
                  path = u.path or ''
                  return urlunsplit((u.scheme.lower(), f'{host_part}:{port}', path, u.query, u.fragment))

              x = x.rstrip('/')
              if x.startswith('['):
                  end = x.find(']')
                  if end < 0:
                      raise ValueError(f'invalid bracketed IPv6 peer: {x!r}')
                  host_part = x[1:end]
                  rest = x[end + 1:]
                  if rest.startswith(':'):
                      port_text = rest[1:]
                      if not port_text.isdigit():
                          raise ValueError(f'invalid EasyTier peer port: {x!r}')
                      port = int(port_text)
                  elif rest == '':
                      port = 11010
                  else:
                      raise ValueError(f'invalid bracketed IPv6 peer: {x!r}')
                  ipaddress.IPv6Address(host_part)
                  return f'tcp://[{host_part}]:{port}'

              if x.count(':') >= 2:
                  ipaddress.IPv6Address(x)
                  return f'tcp://[{x}]:11010'

              host_part = x
              port = 11010
              if ':' in x:
                  host_part, port_text = x.rsplit(':', 1)
                  if not port_text.isdigit():
                      raise ValueError(f'invalid EasyTier peer port: {x!r}')
                  port = int(port_text)
              if not host_part:
                  raise ValueError(f'invalid EasyTier peer host: {x!r}')
              if not 1 <= port <= 65535:
                  raise ValueError(f'EasyTier peer port out of range: {port}')
              return f'tcp://{host_part}:{port}'

          name = esc(os.environ['ET_NETWORK_NAME'])
          secret = esc(os.environ['ET_NETWORK_SECRET'])
          raw_peer = os.environ.get('ET_PEER', '')
          peers = []
          for token in split_peers(raw_peer):
              peer = normalize_peer(token)
              if peer and peer not in peers:
                  peers.append(peer)
          if not peers:
              peers = ['tcp://public.easytier.top:11010']

          cfg = [
              'instance_name = "default"',
              'hostname = "gh-et"',
              'dhcp = false',
              'ipv4 = "10.1.1.51/24"',
              'rpc_portal = "127.0.0.1:15888"',
              'exit_nodes = []',
              '',
              'listeners = [',
              '  "tcp://0.0.0.0:11010",',
              '  "udp://0.0.0.0:11010",',
              '  "wg://0.0.0.0:11011",',
              '  "ws://0.0.0.0:11011/",',
              '  "wss://0.0.0.0:11012/",',
              ']',
              '',
              '[network_identity]',
              f'network_name = "{name}"',
              f'network_secret = "{secret}"',
              ''
          ]
          for peer in peers:
              cfg += ['[[peer]]', f'uri = "{esc(peer)}"', '']
          cfg += [
              '[flags]',
              'default_protocol = "tcp"',
              'dev_name = "et0"',
              'enable_exit_node = true',
              'enable_encryption = true',
              'enable_ipv6 = false',
              'mtu = 1360',
              'latency_first = true',
              'no_tun = false',
              'use_smoltcp = false',
              'proxy_forward_by_system = true',
              'foreign_network_whitelist = "*"',
              'relay_network_whitelist = "*"',
              'disable_p2p = false',
              'disable_udp_hole_punching = false',
              ''
          ]

          config_text = '\n'.join(cfg)
          p.joinpath('config.toml').write_text(config_text)
          p.joinpath('config.toml').chmod(0o600)

          parsed = re.findall(r'^uri\s*=\s*"([^"]+)"$', config_text, re.MULTILINE)
          if not parsed:
              raise SystemExit('no EasyTier peer URI was generated')
          for peer in parsed:
              u = urlsplit(peer)
              if u.scheme not in {'tcp', 'udp', 'wg', 'ws', 'wss'} or not u.hostname:
                  raise SystemExit(f'invalid generated EasyTier peer URI: {peer!r}')
              try:
                  port = u.port
              except ValueError as exc:
                  raise SystemExit(f'invalid generated EasyTier peer port: {peer!r}') from exc
              if port is None or not 1 <= port <= 65535:
                  raise SystemExit(f'invalid generated EasyTier peer port: {peer!r}')

          print('--- EasyTier peer URI(s), normalized ---')
          for peer in parsed:
              print(peer)
          PY
          cloud-localds seed.iso user-data meta-data
          echo '--- EasyTier config (secret masked) ---'
          sed 's/network_secret = .*/network_secret = "***"/' config.toml

      - name: Start QEMU KVM
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          if [ -w /dev/kvm ]; then
            ACCEL=(-machine q35,accel=kvm -enable-kvm -cpu host)
          else
            echo '::warning::/dev/kvm is unavailable; using QEMU TCG'
            ACCEL=(-machine q35 -cpu max)
          fi
          nohup qemu-system-x86_64 "${ACCEL[@]}" \
            -name "$VM_HOSTNAME" \
            -smp "$VM_CPUS" -m "$VM_MEM" \
            -drive file=debian.qcow2,format=qcow2,if=virtio \
            -drive file=seed.iso,format=raw,if=virtio,readonly=on \
            -netdev user,id=n0,hostfwd=tcp::${HOST_SSH_PORT}-:22 \
            -device virtio-net-pci,netdev=n0 \
            -display none -serial file:serial.log >qemu.log 2>&1 &
          echo $! > qemu.pid

      - name: Wait for initial SSH
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          for i in $(seq 1 120); do
            if sshpass -p '' ssh \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o PreferredAuthentications=password \
              -o PubkeyAuthentication=no \
              -o ConnectTimeout=5 \
              -p "$HOST_SSH_PORT" "$VM_USER@127.0.0.1" 'echo ready'; then
              echo 'Initial root SSH with empty password is ready.'
              exit 0
            fi
            if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
              echo '::error::QEMU process exited before SSH became available.'
              tail -200 qemu.log || true
              tail -200 serial.log || true
              exit 1
            fi
            if [ $((i % 12)) -eq 0 ]; then
              echo "Still waiting for root SSH... ${i}/120"
              tail -40 serial.log 2>/dev/null || true
            fi
            sleep 5
          done
          echo '::error::Timed out waiting for initial root SSH.'
          echo '--- QEMU log ---'
          tail -200 qemu.log || true
          echo '--- serial log ---'
          tail -200 serial.log || true
          exit 1

      - name: Install EasyTier and expose SSH 2222
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          ssh_cmd=(sshpass -p '' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=15 -p "$HOST_SSH_PORT" "$VM_USER@127.0.0.1")
          scp_cmd=(sshpass -p '' scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no -P "$HOST_SSH_PORT")
          cat > install.sh <<'SH'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y --no-install-recommends iptables iproute2 unzip ca-certificates curl iputils-ping openssh-server kmod
          install -d -m 0755 /opt/easytier
          unzip -o -j /tmp/easytier.zip -d /opt/easytier
          chmod +x /opt/easytier/easytier-core /opt/easytier/easytier-cli /opt/easytier/easytier-web* 2>/dev/null || true
          install -m 0600 /tmp/config.toml /opt/easytier/config.toml

          mkdir -p /dev/net
          if [ ! -e /dev/net/tun ]; then
            mknod /dev/net/tun c 10 200 2>/dev/null || true
            chmod 666 /dev/net/tun 2>/dev/null || true
          fi
          test -c /dev/net/tun || { echo '::error::/dev/net/tun is unavailable inside Debian VM'; exit 1; }

          passwd -d root || true
          passwd -u root || true
          mkdir -p /etc/ssh/sshd_config.d
          cat > /etc/ssh/sshd_config.d/99-cst-ssh.conf <<'EOF'
          Port 22
          Port 2222
          ListenAddress 0.0.0.0
          ListenAddress ::
          PasswordAuthentication yes
          PermitEmptyPasswords yes
          PermitRootLogin yes
          PubkeyAuthentication yes
          UsePAM yes
          EOF
          sshd -t
          systemctl enable --now ssh
          systemctl restart ssh

          sysctl -w net.ipv4.ip_forward=1
          sysctl -w net.ipv4.conf.all.rp_filter=0
          sysctl -w net.ipv4.conf.default.rp_filter=0
          cat > /etc/sysctl.d/99-cst-easytier.conf <<'EOF'
          net.ipv4.ip_forward=1
          net.ipv4.conf.all.rp_filter=0
          net.ipv4.conf.default.rp_filter=0
          EOF

          cat > /etc/systemd/system/easytier.service <<'EOF'
          [Unit]
          Description=EasyTier VPN
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          ExecStart=/opt/easytier/easytier-core --config-file /opt/easytier/config.toml
          Restart=always
          RestartSec=3
          LimitNOFILE=1048576
          AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW
          CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable easytier
          systemctl restart easytier
          sleep 5

          echo '--- EasyTier service status ---'
          systemctl --no-pager --full status easytier || true
          echo '--- EasyTier journal ---'
          journalctl -u easytier -n 100 --no-pager || true
          systemctl is-active --quiet easytier || { echo '::error::EasyTier failed to start'; exit 1; }

          for i in $(seq 1 60); do
            ip link show et0 >/dev/null 2>&1 && break
            sleep 2
          done
          ip link show et0 >/dev/null 2>&1 || { echo '::error::EasyTier et0 was not created'; journalctl -u easytier -n 100 --no-pager; exit 1; }

          OUT=$(ip route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="dev"){print $(i+1);exit}}')
          [ -n "$OUT" ] || { echo '::error::WAN interface not detected'; exit 1; }
          iptables -C INPUT -p tcp --dport 2222 -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -p tcp --dport 2222 -j ACCEPT
          iptables -C INPUT -i et0 -p tcp --dport 2222 -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -i et0 -p tcp --dport 2222 -j ACCEPT
          iptables -C FORWARD -i et0 -o "$OUT" -j ACCEPT 2>/dev/null || iptables -I FORWARD 1 -i et0 -o "$OUT" -j ACCEPT
          iptables -C FORWARD -i "$OUT" -o et0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || iptables -I FORWARD 1 -i "$OUT" -o et0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          iptables -t nat -C POSTROUTING -o "$OUT" -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -o "$OUT" -j MASQUERADE
          SH
          "${scp_cmd[@]}" easytier.zip config.toml "$VM_USER@127.0.0.1:/tmp/"
          "${scp_cmd[@]}" install.sh "$VM_USER@127.0.0.1:/tmp/install.sh"
          "${ssh_cmd[@]}" 'bash /tmp/install.sh'

      - name: Verify EasyTier exit node and SSH 2222
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          sshpass -p '' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no -p "$HOST_SSH_PORT" "$VM_USER@127.0.0.1" 'bash -s' <<'SH'
          set -e
          systemctl is-active --quiet easytier
          ip -4 addr show et0 | grep -q '10.1.1.51'
          ss -lnt | grep -Eq ':2222[[:space:]]'
          iptables -C INPUT -p tcp --dport 2222 -j ACCEPT
          test "$(cat /proc/sys/net/ipv4/ip_forward)" = 1
          iptables -t nat -S | grep -q MASQUERADE
          echo 'EasyTier exit-node + 10.1.1.51:2222 SSH + NAT: OK'
          SH

      - name: Keep VM alive
        shell: bash
        run: |
          echo 'Debian 13 QEMU/KVM + EasyTier exit node is ready.'
          echo "SSH: ssh -p 2222 root@10.1.1.51"
          sleep "${KEEP_ALIVE_MINUTES}m"

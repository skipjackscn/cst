# GitHub Actions: Debian 13 (Trixie) on real QEMU/KVM + EasyTier
#
# This workflow deliberately does NOT use jobs.container.
# The GitHub runner is only the QEMU/KVM host; Debian runs as a real VM.
#
# Repository Secrets:
#   EASYTIER_NETWORK_NAME     required
#   EASYTIER_NETWORK_SECRET   required
#   EASYTIER_PEER             optional, e.g. tcp://1.2.3.4:11010
#   DEBIAN_ROOT_PASSWORD      optional; default: P@ssw0rd1qazXSW@#
#
# VM login:
#   ssh NvdAdmin@<EasyTier IP>

name: Debian QEMU/KVM

on:
  workflow_dispatch:

jobs:
  qemu-kvm-debian:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Install QEMU/KVM host packages
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils openssh-client sshpass curl ca-certificates jq

          echo '===== KVM CHECK ====='
          if [ ! -e /dev/kvm ]; then
            echo 'ERROR: /dev/kvm is unavailable. Refusing to fall back to QEMU TCG.'
            exit 1
          fi
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm || true
          qemu-system-x86_64 -accel kvm -machine q35 -cpu host -S -display none -nodefaults -no-reboot >/tmp/kvm-test.log 2>&1 &
          test_pid=$!
          sleep 2
          if kill -0 "$test_pid" 2>/dev/null; then
            kill "$test_pid" || true
            wait "$test_pid" 2>/dev/null || true
          else
            echo 'ERROR: QEMU/KVM self-test failed:'
            cat /tmp/kvm-test.log || true
            exit 1
          fi
          echo 'QEMU/KVM acceleration is available.'

      - name: 2. Download Debian 13 genericcloud image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/debian-vm"
          cd "$RUNNER_TEMP/debian-vm"
          IMAGE_URL='https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2'
          echo "Downloading official Debian 13 image: $IMAGE_URL"
          curl -fL --retry 5 --retry-delay 3 -o debian.qcow2 "$IMAGE_URL"
          qemu-img info debian.qcow2
          qemu-img check debian.qcow2

      - name: 3. Build cloud-init seed for the Debian VM
        shell: bash
        env:
          EASYTIER_NETWORK_NAME: ${{ secrets.EASYTIER_NETWORK_NAME }}
          EASYTIER_NETWORK_SECRET: ${{ secrets.EASYTIER_NETWORK_SECRET }}
          EASYTIER_PEER: ${{ secrets.EASYTIER_PEER }}
          DEBIAN_ROOT_PASSWORD: ${{ secrets.DEBIAN_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/debian-vm"
          : "${EASYTIER_NETWORK_NAME:?Missing EASYTIER_NETWORK_NAME}"
          : "${EASYTIER_NETWORK_SECRET:?Missing EASYTIER_NETWORK_SECRET}"

          password="${DEBIAN_ROOT_PASSWORD:-P@ssw0rd1qazXSW@#}"
          b64() { printf '%s' "$1" | base64 -w0; }
          export NETWORK_NAME_B64="$(b64 "$EASYTIER_NETWORK_NAME")"
          export NETWORK_SECRET_B64="$(b64 "$EASYTIER_NETWORK_SECRET")"
          export PEER_B64="$(b64 "${EASYTIER_PEER:-}")"
          export VM_PASSWORD_B64="$(b64 "$password")"

          cat > user-data.template <<'CLOUDINIT'
#cloud-config
hostname: github-debian-kvm
manage_etc_hosts: true
ssh_pwauth: true

package_update: true
packages:
  - openssh-server
  - sudo
  - curl
  - ca-certificates
  - unzip
  - iproute2
  - iptables
  - procps
  - openssl
  - jq

write_files:
  - path: /etc/ssh/sshd_config.d/99-github-kvm.conf
    permissions: '0644'
    content: |
      PasswordAuthentication yes
      PermitRootLogin yes
      UseDNS no
      ClientAliveInterval 30
      ClientAliveCountMax 120

  - path: /root/install-easytier.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      set -euo pipefail

      decode() { printf '%s' "$1" | base64 -d; }
      NETWORK_NAME="$(decode '__NETWORK_NAME_B64__')"
      NETWORK_SECRET="$(decode '__NETWORK_SECRET_B64__')"
      PEER="$(decode '__PEER_B64__')"
      VM_PASSWORD="$(decode '__VM_PASSWORD_B64__')"

      install_root=/opt/easytier
      log_dir=/var/log/easytier
      config_path=$install_root/config.toml
      mkdir -p "$install_root" "$log_dir"

      version=$(curl -fsSL https://api.github.com/repos/EasyTier/EasyTier/releases/latest | jq -r .tag_name)
      [ -n "$version" ] && [ "$version" != "null" ]
      echo "Installing EasyTier $version"

      zip=/tmp/easytier.zip
      url="https://github.com/EasyTier/EasyTier/releases/download/${version}/easytier-linux-x86_64-${version}.zip"
      curl -fL --retry 5 --retry-delay 3 -o "$zip" "$url"
      rm -rf /tmp/easytier-extract
      mkdir -p /tmp/easytier-extract
      unzip -oq "$zip" -d /tmp/easytier-extract
      core=$(find /tmp/easytier-extract -type f -name easytier-core | head -n1)
      cli=$(find /tmp/easytier-extract -type f -name easytier-cli | head -n1 || true)
      [ -n "$core" ] || { echo 'easytier-core not found'; exit 1; }
      cp "$core" "$install_root/easytier-core"
      [ -n "$cli" ] && cp "$cli" "$install_root/easytier-cli" || true
      chmod +x "$install_root/easytier-core" "$install_root/easytier-cli" 2>/dev/null || true

      python3 - "$NETWORK_NAME" "$NETWORK_SECRET" "$PEER" > "$config_path" <<'PY'
import sys

def esc(s):
    return s.replace('\\', '\\\\').replace('"', '\\"')
name, secret, peer = sys.argv[1:]
print('hostname = "github-debian-kvm"')
print('dhcp = true')
print('rpc_portal = "127.0.0.1:15888"')
print('listeners = ["tcp://0.0.0.0:11010", "udp://0.0.0.0:11010"]')
print()
print('[network_identity]')
print(f'network_name = "{esc(name)}"')
print(f'network_secret = "{esc(secret)}"')
print()
print('[[peer]]')
print(f'uri = "{esc(peer if peer else "tcp://public.easytier.cn:11010")}"')
PY

      cat > /etc/systemd/system/easytier.service <<'EOF'
[Unit]
Description=EasyTier VPN
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
ExecStart=/opt/easytier/easytier-core --config-file /opt/easytier/config.toml --file-log-dir /var/log/easytier --file-log-level info
Restart=always
RestartSec=3
LimitNOFILE=1048576

[Install]
WantedBy=multi-user.target
EOF

      systemctl daemon-reload
      systemctl enable --now ssh
      systemctl enable --now easytier

      for i in $(seq 1 90); do
        ip4=$(ip -4 -o addr show | awk '{print $4}' | cut -d/ -f1 | awk '/^10\./{print; exit}')
        if [ -n "$ip4" ]; then
          echo "EasyTier IP: $ip4"
          exit 0
        fi
        sleep 2
      done

      echo 'EasyTier did not obtain a 10.x virtual IP.'
      systemctl status easytier --no-pager || true
      journalctl -u easytier -n 120 --no-pager || true
      tail -n 100 /var/log/easytier/* 2>/dev/null || true
      exit 1

runcmd:
  - [bash, -lc, "password=\$(printf '%s' '__VM_PASSWORD_B64__' | base64 -d); useradd -m -s /bin/bash NvdAdmin 2>/dev/null || true; usermod -aG sudo NvdAdmin; echo \"NvdAdmin:\$password\" | chpasswd; echo \"root:\$password\" | chpasswd; echo 'NvdAdmin ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/NvdAdmin; chmod 440 /etc/sudoers.d/NvdAdmin"]
  - [bash, -lc, "/root/install-easytier.sh > /var/log/easytier-install.log 2>&1 || { cat /var/log/easytier-install.log; exit 1; }"]

final_message: "Debian 13 QEMU/KVM cloud-init completed"
CLOUDINIT

          python3 - <<'PY'
import os
from pathlib import Path
p = Path('user-data.template')
s = p.read_text()
for key in ('NETWORK_NAME_B64','NETWORK_SECRET_B64','PEER_B64','VM_PASSWORD_B64'):
    s = s.replace('__' + key + '__', os.environ[key])
p.with_name('user-data').write_text(s)
PY

          cat > meta-data <<'EOF'
instance-id: github-debian-kvm
local-hostname: github-debian-kvm
EOF
          cloud-localds seed.iso user-data meta-data
          ls -lh debian.qcow2 seed.iso user-data meta-data

      - name: 4. Start real Debian VM with QEMU/KVM
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/debian-vm"
          qemu-img resize debian.qcow2 20G
          rm -f qemu.log serial.log vm.pid

          # Explicit KVM acceleration. No TCG fallback is permitted.
          sudo qemu-system-x86_64 \
            -name github-debian-kvm \
            -machine q35,accel=kvm \
            -enable-kvm \
            -cpu host \
            -smp 2 \
            -m 4096 \
            -drive if=virtio,format=qcow2,file="$PWD/debian.qcow2" \
            -drive if=virtio,format=raw,file="$PWD/seed.iso",readonly=on \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:22222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -device virtio-rng-pci \
            -nographic \
            -serial file:"$PWD/serial.log" \
            -monitor none \
            >"$PWD/qemu.log" 2>&1 &
          echo $! > vm.pid
          sleep 5
          if ! kill -0 "$(cat vm.pid)" 2>/dev/null; then
            echo 'ERROR: QEMU/KVM VM exited immediately.'
            cat qemu.log || true
            exit 1
          fi
          echo "QEMU/KVM VM running, PID=$(cat vm.pid)"

      - name: 5. Wait for Debian and EasyTier
        shell: bash
        env:
          VM_PASSWORD: ${{ secrets.DEBIAN_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/debian-vm"
          password="${VM_PASSWORD:-P@ssw0rd1qazXSW@#}"

          echo 'Waiting for Debian SSH/cloud-init...'
          ready=0
          for i in $(seq 1 150); do
            if sshpass -p "$password" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=3 -p 22222 NvdAdmin@127.0.0.1 'echo SSH_OK' 2>/dev/null | grep -q SSH_OK; then
              ready=1
              echo "Debian SSH is ready after ${i} checks."
              break
            fi
            if ! kill -0 "$(cat vm.pid)" 2>/dev/null; then
              echo 'ERROR: QEMU/KVM process stopped.'
              cat qemu.log || true
              tail -n 200 serial.log || true
              exit 1
            fi
            sleep 4
          done

          if [ "$ready" -ne 1 ]; then
            echo 'ERROR: Debian SSH did not become ready.'
            cat qemu.log || true
            tail -n 300 serial.log || true
            exit 1
          fi

          echo '===== Debian VM identity ====='
          sshpass -p "$password" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22222 NvdAdmin@127.0.0.1 \
            'echo "virtualization=$(systemd-detect-virt)"; uname -a; systemctl is-active easytier || true; ip -4 addr'

          echo '===== Waiting for EasyTier virtual IP ====='
          et_ip=''
          for i in $(seq 1 90); do
            et_ip=$(sshpass -p "$password" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22222 NvdAdmin@127.0.0.1 \
              "ip -4 -o addr show | awk '{print \\$4}' | cut -d/ -f1 | awk '/^10\\./{print; exit}'" 2>/dev/null || true)
            if [ -n "$et_ip" ]; then
              echo "EasyTier virtual IP: $et_ip"
              break
            fi
            sleep 4
          done

          if [ -z "$et_ip" ]; then
            echo 'ERROR: EasyTier virtual IP was not detected.'
            sshpass -p "$password" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22222 NvdAdmin@127.0.0.1 \
              'systemctl status easytier --no-pager || true; journalctl -u easytier -n 150 --no-pager || true; ip addr' || true
            exit 1
          fi

          echo "$et_ip" > easytier.ip
          echo '=========================================='
          echo ' DEBIAN 13 QEMU/KVM SERVER IS READY'
          echo " EasyTier IP : $et_ip"
          echo ' SSH user    : NvdAdmin'
          echo ' SSH password: DEBIAN_ROOT_PASSWORD'
          echo " SSH command : ssh NvdAdmin@$et_ip"
          echo '=========================================='

      - name: 6. Keep QEMU/KVM VM alive
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/debian-vm"
          for i in $(seq 1 330); do
            if ! kill -0 "$(cat vm.pid)" 2>/dev/null; then
              echo 'ERROR: QEMU/KVM VM stopped unexpectedly.'
              cat qemu.log || true
              tail -n 200 serial.log || true
              exit 1
            fi
            echo "[$i/330] QEMU/KVM running, pid=$(cat vm.pid), EasyTier=$(cat easytier.ip 2>/dev/null || echo waiting)"
            sleep 60
          done

      - name: 7. Dump VM diagnostics
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/debian-vm" 2>/dev/null || exit 0
          echo '===== qemu.log ====='
          cat qemu.log 2>/dev/null || true
          echo '===== serial.log (last 300 lines) ====='
          tail -n 300 serial.log 2>/dev/null || true
          echo '===== VM files ====='
          ls -lh 2>/dev/null || true

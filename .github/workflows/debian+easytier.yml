name: Debian 13 QEMU KVM EasyTier

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/debian+easytier.yml'
      - 'scripts/debian-cloud-init.yml'
      - 'scripts/debian-easytier-bootstrap.sh'

permissions:
  contents: read

jobs:
  debian-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VM_NAME: cst-debian
      VM_SSH_PORT: '22222'
      DEBIAN_IMAGE_URL: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
      EASYTIER_NETWORK_NAME: ${{ secrets.EASYTIER_NETWORK_NAME }}
      EASYTIER_NETWORK_SECRET: ${{ secrets.EASYTIER_NETWORK_SECRET }}
      EASYTIER_PEER: ${{ secrets.EASYTIER_PEER }}
      DEBIAN_ROOT_PASSWORD: ${{ secrets.DEBIAN_ROOT_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EASYTIER_NETWORK_NAME" || { echo 'Missing EASYTIER_NETWORK_NAME'; exit 1; }
          test -n "$EASYTIER_NETWORK_SECRET" || { echo 'Missing EASYTIER_NETWORK_SECRET'; exit 1; }
          test -n "$DEBIAN_ROOT_PASSWORD" || { echo 'Missing DEBIAN_ROOT_PASSWORD'; exit 1; }

      - name: Prepare VM directory
        shell: bash
        run: |
          set -euo pipefail
          VM_DIR="$RUNNER_TEMP/cst-debian-vm"
          echo "VM_DIR=$VM_DIR" >> "$GITHUB_ENV"
          rm -rf "$VM_DIR"
          mkdir -p "$VM_DIR/seed"

      - name: Install QEMU and cloud-init tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils qemu-kvm cloud-image-utils openssh-client sshpass curl
          qemu-system-x86_64 --version | head -n1

      - name: Select QEMU acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm || true
            set +e
            timeout 5s qemu-system-x86_64 -accel kvm -machine q35 -nodefaults -nographic -S -display none
            rc=$?
            set -e
            if [[ $rc -eq 124 ]]; then
              echo 'KVM acceleration available.'
              echo 'QEMU_ACCEL=-accel kvm' >> "$GITHUB_ENV"
              echo 'QEMU_CPU=-cpu host' >> "$GITHUB_ENV"
              exit 0
            fi
            echo "KVM self-test failed with exit code $rc; using TCG."
          else
            echo 'KVM device unavailable; using TCG.'
          fi
          echo 'QEMU_ACCEL=-accel tcg,thread=multi' >> "$GITHUB_ENV"
          echo 'QEMU_CPU=-cpu max' >> "$GITHUB_ENV"

      - name: Download Debian 13 stable cloud image
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 -o "$VM_DIR/debian.qcow2" "$DEBIAN_IMAGE_URL"
          test -s "$VM_DIR/debian.qcow2"
          qemu-img info "$VM_DIR/debian.qcow2"
          qemu-img resize "$VM_DIR/debian.qcow2" 20G

      - name: Render cloud-init seed
        shell: bash
        env:
          ET_NAME: ${{ secrets.EASYTIER_NETWORK_NAME }}
          ET_SECRET: ${{ secrets.EASYTIER_NETWORK_SECRET }}
          ET_PEER: ${{ secrets.EASYTIER_PEER }}
          ROOT_PASSWORD: ${{ secrets.DEBIAN_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          PEER="${ET_PEER:-tcp://public.easytier.cn:11010}"
          ET_ENV="$(printf '%s\n' \
            "ET_NAME_B64=$(printf '%s' "$ET_NAME" | base64 -w0)" \
            "ET_SECRET_B64=$(printf '%s' "$ET_SECRET" | base64 -w0)" \
            "ET_PEER_B64=$(printf '%s' "$PEER" | base64 -w0)" \
            "ROOT_PASSWORD_B64=$(printf '%s' "$ROOT_PASSWORD" | base64 -w0)")"
          ET_ENV_B64="$(printf '%s' "$ET_ENV" | base64 -w0)"
          cp scripts/debian-cloud-init.yml "$VM_DIR/seed/user-data"
          sed -i "s|__EASYTIER_ENV_B64__|$ET_ENV_B64|g" "$VM_DIR/seed/user-data"
          printf '%s\n' 'instance-id: cst-debian' 'local-hostname: cst-debian' > "$VM_DIR/seed/meta-data"
          printf '%s\n' 'version: 2' 'ethernets:' '  ens3:' '    dhcp4: true' > "$VM_DIR/seed/network-config"
          cloud-localds --network-config="$VM_DIR/seed/network-config" "$VM_DIR/seed.iso" "$VM_DIR/seed/user-data" "$VM_DIR/seed/meta-data"
          chmod 600 "$VM_DIR/seed/user-data"

      - name: Boot Debian VM
        shell: bash
        run: |
          set -euo pipefail
          nohup qemu-system-x86_64 \
            -name "$VM_NAME" \
            -machine q35 \
            $QEMU_ACCEL \
            $QEMU_CPU \
            -smp 2 \
            -m 4096 \
            -drive "file=$VM_DIR/debian.qcow2,if=virtio,format=qcow2,cache=writeback" \
            -drive "file=$VM_DIR/seed.iso,media=cdrom,readonly=on" \
            -netdev "user,id=net0,hostfwd=tcp:127.0.0.1:$VM_SSH_PORT-:22" \
            -device virtio-net-pci,netdev=net0 \
            -nographic \
            -serial "file:$VM_DIR/serial.log" \
            >"$VM_DIR/qemu.log" 2>&1 &
          QEMU_PID=$!
          echo "$QEMU_PID" > "$VM_DIR/qemu.pid"
          sleep 5
          if ! kill -0 "$QEMU_PID" 2>/dev/null; then
            echo 'ERROR: QEMU exited during startup.'
            tail -n 300 "$VM_DIR/qemu.log" 2>/dev/null || true
            exit 1
          fi
          echo 'Debian VM started.'

      - name: Wait for Debian and EasyTier
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="$DEBIAN_ROOT_PASSWORD"
          SSH_OPTS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o ConnectionAttempts=2)
          for i in $(seq 1 90); do
            if SSHPASS="$PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" -p "$VM_SSH_PORT" root@127.0.0.1 'echo SSH_OK' >/dev/null 2>&1; then
              echo 'Debian SSH is ready.'
              break
            fi
            if [[ "$i" -eq 90 ]]; then
              echo 'ERROR: Debian SSH timeout.'
              tail -n 300 "$VM_DIR/serial.log" 2>/dev/null || true
              tail -n 300 "$VM_DIR/qemu.log" 2>/dev/null || true
              exit 1
            fi
            sleep 4
          done

          ET_IP=''
          for i in $(seq 1 72); do
            OUT="$(SSHPASS="$PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" -p "$VM_SSH_PORT" root@127.0.0.1 'systemctl is-active easytier.service || true; ip -4 addr show || true; /opt/easytier/easytier-cli --rpc-portal 127.0.0.1:15888 node 2>&1 || true' 2>/dev/null || true)"
            echo "[$i/72] $OUT"
            ET_IP="$(printf '%s\n' "$OUT" | sed -nE 's/.*Virtual IP[[:space:]]*\|[[:space:]]*(10\.[0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n1)"
            if [[ -z "$ET_IP" ]]; then
              ET_IP="$(printf '%s\n' "$OUT" | sed -nE 's/.*inet (10\.[0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n1)"
            fi
            if [[ -n "$ET_IP" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$ET_IP" ]]; then
            echo 'ERROR: EasyTier virtual IP was not detected.'
            SSHPASS="$PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" -p "$VM_SSH_PORT" root@127.0.0.1 'systemctl status easytier.service --no-pager || true; journalctl -u easytier.service --no-pager -n 200 || true' || true
            exit 1
          fi
          echo "EASYTIER_IP=$ET_IP" >> "$GITHUB_ENV"
          echo '=========================================='
          echo 'DEBIAN 13 QEMU/KVM + EASYTIER READY'
          echo "EasyTier IP : $ET_IP"
          echo 'SSH user    : root'
          echo 'SSH port    : 22'
          echo '=========================================='

      - name: Keep VM alive
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 360); do
            if ! kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null; then
              echo 'QEMU stopped unexpectedly.'
              tail -n 200 "$VM_DIR/qemu.log" 2>/dev/null || true
              exit 1
            fi
            echo "[$i/360] Debian VM running; EasyTier IP=$EASYTIER_IP"
            sleep 60
          done

      - name: Collect VM logs on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo '===== qemu.log ====='
          tail -n 300 "$VM_DIR/qemu.log" 2>/dev/null || true
          echo '===== serial.log ====='
          tail -n 300 "$VM_DIR/serial.log" 2>/dev/null || true

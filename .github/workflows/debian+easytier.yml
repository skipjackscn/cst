name: Debian 13 QEMU KVM EasyTier

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/debian+easytier.yml

permissions:
  contents: read

jobs:
  debian-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VM_NAME: cst-debian
      VM_SSH_PORT: "22222"
      DEBIAN_IMAGE_URL: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
      EASYTIER_NETWORK_NAME: ${{ secrets.EASYTIER_NETWORK_NAME }}
      EASYTIER_NETWORK_SECRET: ${{ secrets.EASYTIER_NETWORK_SECRET }}
      EASYTIER_PEER: ${{ secrets.EASYTIER_PEER }}
      DEBIAN_ROOT_PASSWORD: ${{ secrets.DEBIAN_ROOT_PASSWORD }}

    steps:
      - name: Prepare VM directory
        shell: bash
        run: |
          set -euo pipefail
          VM_DIR="$RUNNER_TEMP/cst-debian-vm"
          echo "VM_DIR=$VM_DIR" >> "$GITHUB_ENV"
          rm -rf "$VM_DIR"
          mkdir -p "$VM_DIR/seed"

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EASYTIER_NETWORK_NAME" || { echo 'Missing EASYTIER_NETWORK_NAME'; exit 1; }
          test -n "$EASYTIER_NETWORK_SECRET" || { echo 'Missing EASYTIER_NETWORK_SECRET'; exit 1; }

      - name: Install QEMU and tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils qemu-kvm cloud-image-utils openssh-client sshpass curl
          qemu-system-x86_64 --version | head -n1

      - name: Verify KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm || { echo 'ERROR: /dev/kvm is unavailable'; exit 1; }
          sudo chmod 666 /dev/kvm || true
          set +e
          timeout 5s qemu-system-x86_64 -accel kvm -machine q35 -nodefaults -nographic -S -display none
          rc=$?
          set -e
          if [[ $rc -ne 124 ]]; then
            echo "ERROR: KVM self-test failed with exit code $rc"
            exit 1
          fi
          echo 'KVM OK.'

      - name: Download Debian 13 cloud image
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 -o "$VM_DIR/debian.qcow2" "$DEBIAN_IMAGE_URL"
          test -s "$VM_DIR/debian.qcow2"
          qemu-img resize "$VM_DIR/debian.qcow2" 20G

      - name: Build cloud-init seed
        shell: bash
        env:
          ET_NAME: ${{ secrets.EASYTIER_NETWORK_NAME }}
          ET_SECRET: ${{ secrets.EASYTIER_NETWORK_SECRET }}
          ET_PEER: ${{ secrets.EASYTIER_PEER }}
          ROOT_PASSWORD: ${{ secrets.DEBIAN_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          PEER="${ET_PEER:-tcp://public.easytier.cn:11010}"
          PASSWORD="${ROOT_PASSWORD:-CstDebian@2026!}"
          CONFIG_B64="$(printf '%s\n' \
            'instance_name = "cst-debian"' \
            'hostname = "CST-DEBIAN"' \
            'ipv4 = "10.1.1.52/24"' \
            'dhcp = false' \
            'listeners = ["tcp://0.0.0.0:11010", "udp://0.0.0.0:11010", "wg://0.0.0.0:11011"]' \
            'rpc_portal = "127.0.0.1:15888"' \
            '' \
            '[network_identity]' \
            "network_name = \"$ET_NAME\"" \
            "network_secret = \"$ET_SECRET\"" \
            '' \
            '[[peer]]' \
            "uri = \"$PEER\"" \
            '' \
            '[flags]' \
            'default_protocol = "udp"' \
            'enable_encryption = true' \
            'enable_ipv6 = false' \
            'latency_first = true' \
            'enable_exit_node = true' \
            'no_tun = false' \
            'foreign_network_whitelist = "*"' \
            | base64 -w0)"
          PASS_B64="$(printf '%s' "$PASSWORD" | base64 -w0)"
          SERVICE_B64=''
          USER_B64=''
          printf '%s' "$USER_B64" | base64 -d > "$VM_DIR/seed/user-data"
          sed -i \
            -e "s|__ROOT_PASS_B64__|$PASS_B64|g" \
            -e "s|__ET_CONFIG_B64__|$CONFIG_B64|g" \
            -e "s|__SERVICE_B64__|$SERVICE_B64|g" \
            "$VM_DIR/seed/user-data"
          printf '%s\n' 'instance-id: cst-debian' 'local-hostname: cst-debian' > "$VM_DIR/seed/meta-data"
          printf '%s\n' 'version: 2' 'ethernets:' '  ens3:' '    dhcp4: true' > "$VM_DIR/seed/network-config"
          cloud-localds --network-config="$VM_DIR/seed/network-config" "$VM_DIR/seed.iso" "$VM_DIR/seed/user-data" "$VM_DIR/seed/meta-data"
          chmod 600 "$VM_DIR/seed/user-data"

      - name: Boot Debian VM with QEMU/KVM
        shell: bash
        run: |
          set -euo pipefail
          nohup qemu-system-x86_64 \
            -name "$VM_NAME" \
            -machine q35,accel=kvm \
            -enable-kvm \
            -cpu host \
            -smp 2 \
            -m 4096 \
            -drive "file=$VM_DIR/debian.qcow2,if=virtio,format=qcow2,cache=writeback" \
            -drive "file=$VM_DIR/seed.iso,media=cdrom,readonly=on" \
            -netdev "user,id=net0,hostfwd=tcp:127.0.0.1:$VM_SSH_PORT-:22" \
            -device virtio-net-pci,netdev=net0 \
            -nographic \
            -serial "file=$VM_DIR/serial.log" \
            >"$VM_DIR/qemu.log" 2>&1 &
          echo $! > "$VM_DIR/qemu.pid"
          sleep 5
          kill -0 "$(cat "$VM_DIR/qemu.pid")"
          echo 'Debian VM started.'

      - name: Wait for Debian SSH and EasyTier
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="${DEBIAN_ROOT_PASSWORD:-CstDebian@2026!}"
          SSH_OPTS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o ConnectionAttempts=2)
          for i in $(seq 1 90); do
            if SSHPASS="$PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" -p "$VM_SSH_PORT" root@127.0.0.1 'echo SSH_OK' >/dev/null 2>&1; then
              echo 'Debian SSH is ready.'
              break
            fi
            if [[ "$i" -eq 90 ]]; then
              echo 'ERROR: Debian SSH timeout.'
              tail -n 200 "$VM_DIR/serial.log" || true
              tail -n 200 "$VM_DIR/qemu.log" || true
              exit 1
            fi
            sleep 4
          done

          ET_IP=''
          for i in $(seq 1 60); do
            OUT="$(SSHPASS="$PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" -p "$VM_SSH_PORT" root@127.0.0.1 'systemctl is-active easytier.service || true; /opt/easytier/easytier-cli --rpc-portal 127.0.0.1:15888 node 2>&1 || true; ip -4 addr show' 2>/dev/null || true)"
            echo "[$i/60] $OUT"
            ET_IP="$(printf '%s\n' "$OUT" | sed -nE 's/.*Virtual IP[[:space:]]*\|[[:space:]]*(10\.[0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n1)"
            if [[ -z "$ET_IP" ]]; then
              ET_IP="$(printf '%s\n' "$OUT" | sed -nE 's/.*inet (10\.[0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n1)"
            fi
            if [[ -n "$ET_IP" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$ET_IP" ]]; then
            SSHPASS="$PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" -p "$VM_SSH_PORT" root@127.0.0.1 'journalctl -u easytier.service --no-pager -n 200 || true; cat /var/log/easytier/* 2>/dev/null || true' || true
            exit 1
          fi
          echo "EASYTIER_IP=$ET_IP" >> "$GITHUB_ENV"
          echo '=========================================='
          echo 'DEBIAN 13 QEMU/KVM + EASYTIER READY'
          echo "EasyTier IP : $ET_IP"
          echo 'SSH user    : root'
          echo 'SSH port    : 22'
          echo '=========================================='

      - name: Keep VM alive
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 360); do
            if ! kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null; then
              echo 'QEMU stopped unexpectedly.'
              tail -n 200 "$VM_DIR/qemu.log" || true
              exit 1
            fi
            echo "[$i/360] Debian VM running; EasyTier IP=$EASYTIER_IP"
            sleep 60
          done

name: Debian 13 QEMU KVM EasyTier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VM_NAME: cst-debian
      VM_SSH_PORT: '22222'
      DEBIAN_IMAGE_URL: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
      EASYTIER_NETWORK_NAME: ${{ secrets.EASYTIER_NETWORK_NAME }}
      EASYTIER_NETWORK_SECRET: ${{ secrets.EASYTIER_NETWORK_SECRET }}
      EASYTIER_PEER: ${{ secrets.EASYTIER_PEER }}
      DEBIAN_ROOT_PASSWORD: ${{ secrets.DEBIAN_ROOT_PASSWORD }}

    steps:
      - name: Prepare VM directory
        shell: bash
        run: |
          set -euo pipefail
          VM_DIR="$RUNNER_TEMP/cst-debian-vm"
          echo "VM_DIR=$VM_DIR" >> "$GITHUB_ENV"
          rm -rf "$VM_DIR"
          mkdir -p "$VM_DIR/seed"

      - name: Check EasyTier secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EASYTIER_NETWORK_NAME:-}" || { echo 'Missing EASYTIER_NETWORK_NAME'; exit 1; }
          test -n "${EASYTIER_NETWORK_SECRET:-}" || { echo 'Missing EASYTIER_NETWORK_SECRET'; exit 1; }

      - name: Install QEMU and tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils qemu-kvm cloud-image-utils openssh-client sshpass curl unzip netcat-openbsd

      - name: Check KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm || { echo '/dev/kvm is unavailable'; exit 1; }
          sudo chmod 666 /dev/kvm || true
          timeout 5 qemu-system-x86_64 -accel kvm -machine q35 -nodefaults -nographic -S -display none
          test "${PIPESTATUS[0]}" -eq 124 || true
          echo 'KVM is available.'

      - name: Download Debian 13 latest image
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 -o "$VM_DIR/debian.qcow2" "$DEBIAN_IMAGE_URL"
          test -s "$VM_DIR/debian.qcow2"
          qemu-img resize "$VM_DIR/debian.qcow2" 20G

      - name: Create cloud-init seed
        shell: bash
        run: |
          set -euo pipefail

          PASSWORD="${DEBIAN_ROOT_PASSWORD:-CstDebian@2026!}"
          PEER="${EASYTIER_PEER:-tcp://public.easytier.cn:11010}"

          NET_NAME_B64="$(printf '%s' "$EASYTIER_NETWORK_NAME" | base64 -w0)"
          NET_SECRET_B64="$(printf '%s' "$EASYTIER_NETWORK_SECRET" | base64 -w0)"
          PEER_B64="$(printf '%s' "$PEER" | base64 -w0)"
          PASSWORD_B64="$(printf '%s' "$PASSWORD" | base64 -w0)"

          cat > "$VM_DIR/seed/user-data" <<EOF
#cloud-config
hostname: cst-debian
manage_etc_hosts: true
ssh_pwauth: true
disable_root: false
chpasswd:
  expire: false
  users:
    - name: root
      password: ${PASSWORD_B64}
      type: text
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - wget
  - unzip
  - openssh-server
  - iproute2
  - iputils-ping
  - procps
  - net-tools
  - sudo
write_files:
  - path: /etc/ssh/sshd_config.d/99-cst.conf
    permissions: '0600'
    owner: root:root
    content: |
      PermitRootLogin yes
      PasswordAuthentication yes
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
  - path: /opt/install-easytier.sh
    permissions: '0700'
    owner: root:root
    content: |
      #!/bin/bash
      set -euo pipefail
      mkdir -p /opt/easytier /var/log/easytier
      NET_NAME="\$(printf '%s' '${NET_NAME_B64}' | base64 -d)"
      NET_SECRET="\$(printf '%s' '${NET_SECRET_B64}' | base64 -d)"
      PEER="\$(printf '%s' '${PEER_B64}' | base64 -d)"
      LATEST="\$(curl -fsSL https://api.github.com/repos/EasyTier/EasyTier/releases/latest | sed -n 's/.*"tag_name": "\([^"]*\)".*/\1/p' | head -n1)"
      test -n "\$LATEST"
      ASSET="easytier-linux-x86_64-\${LATEST}.zip"
      curl -fL --retry 5 --retry-delay 2 -o /tmp/easytier.zip "https://github.com/EasyTier/EasyTier/releases/download/\${LATEST}/\${ASSET}"
      rm -rf /tmp/easytier-extract
      mkdir -p /tmp/easytier-extract
      unzip -oq /tmp/easytier.zip -d /tmp/easytier-extract
      CORE="\$(find /tmp/easytier-extract -type f -name easytier-core | head -n1)"
      CLI="\$(find /tmp/easytier-extract -type f -name easytier-cli | head -n1)"
      test -n "\$CORE" && test -n "\$CLI"
      install -m 0755 "\$CORE" /opt/easytier/easytier-core
      install -m 0755 "\$CLI" /opt/easytier/easytier-cli
      cat > /opt/easytier/config.toml <<CONFIG
      hostname = "CST-DEBIAN"
      ipv4 = "10.1.1.52/24"
      dhcp = false
      rpc_portal = "127.0.0.1:15888"
      listeners = ["tcp://0.0.0.0:11010", "udp://0.0.0.0:11010", "wg://0.0.0.0:11011"]
      [network_identity]
      network_name = "\$NET_NAME"
      network_secret = "\$NET_SECRET"
      [[peer]]
      uri = "\$PEER"
      [flags]
      enable_encryption = true
      multi_thread = true
      latency_first = true
      enable_exit_node = true
      enable_ipv6 = false
      CONFIG
      chmod 0600 /opt/easytier/config.toml
      cat > /etc/systemd/system/easytier.service <<SERVICE
      [Unit]
      Description=EasyTier Virtual Network
      Wants=network-online.target
      After=network-online.target
      [Service]
      Type=simple
      ExecStart=/opt/easytier/easytier-core --config-file /opt/easytier/config.toml --file-log-dir /var/log/easytier --file-log-level info
      Restart=always
      RestartSec=3
      LimitNOFILE=1048576
      [Install]
      WantedBy=multi-user.target
      SERVICE
      systemctl daemon-reload
      systemctl enable --now easytier.service
runcmd:
  - systemctl daemon-reload
  - systemctl enable --now ssh
  - /opt/install-easytier.sh
  - rm -f /opt/install-easytier.sh
EOF

          cat > "$VM_DIR/seed/meta-data" <<EOF
instance-id: cst-debian
local-hostname: cst-debian
EOF

          cat > "$VM_DIR/seed/network-config" <<EOF
version: 2
ethernets:
  ens3:
    dhcp4: true
EOF

          cloud-localds --network-config="$VM_DIR/seed/network-config" "$VM_DIR/seed.iso" "$VM_DIR/seed/user-data" "$VM_DIR/seed/meta-data"
          chmod 600 "$VM_DIR/seed/user-data"

      - name: Boot Debian VM
        shell: bash
        run: |
          set -euo pipefail
          nohup qemu-system-x86_64 \
            -name "$VM_NAME" \
            -machine q35,accel=kvm \
            -enable-kvm \
            -cpu host \
            -smp 2 \
            -m 4096 \
            -drive "file=$VM_DIR/debian.qcow2,if=virtio,format=qcow2,cache=writeback" \
            -drive "file=$VM_DIR/seed.iso,media=cdrom,readonly=on" \
            -netdev "user,id=net0,hostfwd=tcp:127.0.0.1:$VM_SSH_PORT-:22" \
            -device virtio-net-pci,netdev=net0 \
            -nographic \
            -serial "file=$VM_DIR/serial.log" \
            >"$VM_DIR/qemu.log" 2>&1 &
          echo $! > "$VM_DIR/qemu.pid"
          sleep 5
          kill -0 "$(cat "$VM_DIR/qemu.pid")"

      - name: Wait for Debian and EasyTier
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="${DEBIAN_ROOT_PASSWORD:-CstDebian@2026!}"
          SSH_OPTS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o ConnectionAttempts=2)

          for i in $(seq 1 90); do
            if SSHPASS="$PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" -p "$VM_SSH_PORT" root@127.0.0.1 'echo SSH_OK' 2>/dev/null; then
              break
            fi
            if [[ "$i" -eq 90 ]]; then
              echo 'Debian SSH did not become ready.'
              tail -n 160 "$VM_DIR/serial.log" || true
              tail -n 160 "$VM_DIR/qemu.log" || true
              exit 1
            fi
            sleep 4
          done

          ET_IP=''
          for i in $(seq 1 60); do
            OUT="$(SSHPASS="$PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" -p "$VM_SSH_PORT" root@127.0.0.1 'systemctl is-active easytier.service || true; ip -4 addr show || true' 2>/dev/null || true)"
            echo "[$i/60] $OUT"
            ET_IP="$(printf '%s\n' "$OUT" | sed -nE 's/.*inet (10\.[0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n1)"
            if [[ -n "$ET_IP" ]]; then
              break
            fi
            sleep 5
          done

          test -n "$ET_IP" || {
            SSHPASS="$PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" -p "$VM_SSH_PORT" root@127.0.0.1 'journalctl -u easytier.service --no-pager -n 160 || true' || true
            exit 1
          }

          echo "EASYTIER_IP=$ET_IP" >> "$GITHUB_ENV"
          echo '=========================================='
          echo 'DEBIAN 13 QEMU/KVM IS READY'
          echo "EasyTier IP : $ET_IP"
          echo 'SSH user    : root'
          echo 'SSH port    : 22'
          echo '=========================================='

      - name: Keep Debian and EasyTier alive
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="${DEBIAN_ROOT_PASSWORD:-CstDebian@2026!}"
          SSH_OPTS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5)
          for i in $(seq 1 360); do
            if ! kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null; then
              echo 'QEMU process stopped.'
              tail -n 120 "$VM_DIR/qemu.log" || true
              exit 1
            fi
            echo "[$i/360] Debian VM + EasyTier running; EasyTier IP=$EASYTIER_IP"
            sleep 60
          done

# GitHub Actions: Debian latest QEMU/KVM + EasyTier
#
# 运行方式：
#   GitHub Actions -> Debian latest QEMU/KVM + EasyTier -> Run workflow
#
# Repository Secrets:
#   EASYTIER_NETWORK_NAME     必填
#   EASYTIER_NETWORK_SECRET   必填
#   EASYTIER_PEER             可选，默认 tcp://public.easytier.cn:11010
#   DEBIAN_ROOT_PASSWORD      可选，Debian root SSH 密码；未设置时使用下面的默认值
#
# 重要：
#   1. 这是真正的 QEMU/KVM Debian 虚拟机，不再是 Docker Debian 容器。
#   2. Debian 使用官方 Debian Cloud Team 的 trixie/daily/latest qcow2 镜像。
#   3. EasyTier 安装在 Debian 虚拟机内部。
#   4. VM 使用 QEMU user-mode NAT 上网，EasyTier 负责虚拟网络互联。
#   5. GitHub-hosted runner 必须能访问 /dev/kvm；如果当前 runner 没有可用 KVM，Workflow 会明确失败，避免偷偷退化成极慢的 TCG。
#
# Debian 官方说明支持使用官方 cloud image 运行本地 QEMU；当前 Debian 13 为 Trixie。
# EasyTier 使用其官方 latest release 安装脚本所采用的 release asset 命名方式。

name: Debian latest QEMU-KVM EasyTier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      VM_NAME: cst-debian
      VM_DIR: ${{ runner.temp }}/cst-debian-vm
      VM_SSH_PORT: '22222'
      DEBIAN_IMAGE_URL: https://cloud.debian.org/images/cloud/trixie/daily/latest/debian-13-generic-amd64-daily.qcow2
      EASYTIER_NETWORK_NAME: ${{ secrets.EASYTIER_NETWORK_NAME }}
      EASYTIER_NETWORK_SECRET: ${{ secrets.EASYTIER_NETWORK_SECRET }}
      EASYTIER_PEER: ${{ secrets.EASYTIER_PEER }}
      DEBIAN_ROOT_PASSWORD: ${{ secrets.DEBIAN_ROOT_PASSWORD }}

    steps:
      - name: 1. Check repository EasyTier secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EASYTIER_NETWORK_NAME:-}" ]]; then
            echo 'ERROR: EASYTIER_NETWORK_NAME is missing.'
            exit 1
          fi
          if [[ -z "${EASYTIER_NETWORK_SECRET:-}" ]]; then
            echo 'ERROR: EASYTIER_NETWORK_SECRET is missing.'
            exit 1
          fi
          echo 'EasyTier repository secrets are present.'
          echo "EasyTier peer: ${EASYTIER_PEER:-tcp://public.easytier.cn:11010}"

      - name: 2. Install QEMU/KVM and cloud-init tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            cloud-image-utils \
            openssh-client \
            curl \
            unzip \
            netcat-openbsd

          echo '===== QEMU ====='
          qemu-system-x86_64 --version | head -n1
          qemu-img --version | head -n1

      - name: 3. Verify KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo '===== KVM device ====='
          ls -l /dev/kvm || true
          if [[ ! -e /dev/kvm ]]; then
            echo 'ERROR: /dev/kvm is not available on this GitHub-hosted runner.'
            echo 'This workflow intentionally requires KVM and will not silently fall back to TCG.'
            exit 1
          fi

          sudo chmod 666 /dev/kvm || true
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo 'ERROR: /dev/kvm exists but is not accessible.'
            exit 1
          fi

          echo 'KVM device is accessible.'
          sudo apt-get install -y qemu-kvm || true
          if ! sudo qemu-system-x86_64 -accel kvm -machine accel=kvm,help >/dev/null 2>&1; then
            echo 'ERROR: QEMU cannot initialize KVM on this runner.'
            exit 1
          fi
          echo 'QEMU/KVM acceleration is available.'

      - name: 4. Download latest Debian 13 cloud image
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VM_DIR"
          mkdir -p "$VM_DIR"

          echo "Downloading official Debian latest Trixie cloud image:"
          echo "$DEBIAN_IMAGE_URL"
          curl -fL --retry 5 --retry-delay 3 \
            -o "$VM_DIR/debian.qcow2" \
            "$DEBIAN_IMAGE_URL"

          test -s "$VM_DIR/debian.qcow2"
          qemu-img info "$VM_DIR/debian.qcow2"

          # 给 VM 扩容到 20 GiB。
          qemu-img resize "$VM_DIR/debian.qcow2" 20G
          qemu-img info "$VM_DIR/debian.qcow2"

      - name: 5. Build Debian cloud-init seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VM_DIR/seed"

          PASSWORD="${DEBIAN_ROOT_PASSWORD:-CstDebian@2026!}"
          PEER="${EASYTIER_PEER:-tcp://public.easytier.cn:11010}"

          # 生成 user-data。EasyTier 网络凭据只写入 runner 临时目录，
          # 不在 GitHub Actions 日志中打印 config.toml 内容。
          python3 - "$VM_DIR/seed/user-data" "$EASYTIER_NETWORK_NAME" "$EASYTIER_NETWORK_SECRET" "$PEER" "$PASSWORD" <<'PY'
          import sys
          from pathlib import Path

          out, net_name, net_secret, peer, password = sys.argv[1:]

          def yaml_sq(s: str) -> str:
              return "'" + s.replace("'", "''") + "'"

          # cloud-init 将这些内容作为 root 用户启动脚本执行。
          # 密码和 EasyTier secret 通过 cloud-init 文件传入 VM，不打印到 Actions log。
          text = f'''#cloud-config
          preserve_hostname: false
          hostname: cst-debian
          manage_etc_hosts: true
          ssh_pwauth: true
          disable_root: false

          chpasswd:
            expire: false
            users:
              - name: root
                password: {yaml_sq(password)}
                type: text

          package_update: true
          package_upgrade: true
          packages:
            - ca-certificates
            - curl
            - wget
            - unzip
            - openssh-server
            - iproute2
            - iputils-ping
            - procps
            - net-tools
            - sudo

          write_files:
            - path: /etc/ssh/sshd_config.d/99-cst.conf
              permissions: '0600'
              owner: root:root
              content: |
                PermitRootLogin yes
                PasswordAuthentication yes
                KbdInteractiveAuthentication no
                PubkeyAuthentication yes

            - path: /opt/install-easytier.sh
              permissions: '0700'
              owner: root:root
              content: |
                #!/bin/bash
                set -euo pipefail
                mkdir -p /opt/easytier /var/log/easytier
                export DEBIAN_FRONTEND=noninteractive

                latest="$(curl -fsSL https://api.github.com/repos/EasyTier/EasyTier/releases/latest | grep '"tag_name"' | head -n1 | sed -E 's/.*"([^\"]+)".*/\\1/')"
                if [ -z "$latest" ]; then
                  echo 'Unable to determine latest EasyTier release.' >&2
                  exit 1
                fi

                arch="$(uname -m)"
                case "$arch" in
                  x86_64) et_arch='x86_64' ;;
                  aarch64) et_arch='aarch64' ;;
                  armv7l|armv7) et_arch='armv7' ;;
                  *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
                esac

                asset="easytier-linux-${{et_arch}}-${{latest}}.zip"
                url="https://github.com/EasyTier/EasyTier/releases/download/${{latest}}/${{asset}}"
                echo "Installing EasyTier $latest"
                curl -fL --retry 5 --retry-delay 2 -o /tmp/easytier.zip "$url"
                rm -rf /tmp/easytier-extract
                mkdir -p /tmp/easytier-extract
                unzip -oq /tmp/easytier.zip -d /tmp/easytier-extract

                core="$(find /tmp/easytier-extract -type f -name easytier-core | head -n1)"
                cli="$(find /tmp/easytier-extract -type f -name easytier-cli | head -n1)"
                test -n "$core" && test -n "$cli"
                install -m 0755 "$core" /opt/easytier/easytier-core
                install -m 0755 "$cli" /opt/easytier/easytier-cli

                cat > /opt/easytier/config.toml <<'CONFIG'
                hostname = "CST-DEBIAN"
                ipv4 = "10.1.1.52/24"
                dhcp = false
                rpc_portal = "127.0.0.1:15888"
                listeners = ["tcp://0.0.0.0:11010", "udp://0.0.0.0:11010", "wg://0.0.0.0:11011"]

                [network_identity]
                network_name = {yaml_sq(net_name)}
                network_secret = {yaml_sq(net_secret)}

                [[peer]]
                uri = {yaml_sq(peer)}

                [flags]
                enable_encryption = true
                multi_thread = true
                latency_first = true
                enable_exit_node = true
                enable_ipv6 = false
                CONFIG

                chmod 0600 /opt/easytier/config.toml

                cat > /etc/systemd/system/easytier.service <<'SERVICE'
                [Unit]
                Description=EasyTier Virtual Network
                Wants=network-online.target
                After=network-online.target

                [Service]
                Type=simple
                ExecStart=/opt/easytier/easytier-core --config-file /opt/easytier/config.toml --file-log-dir /var/log/easytier --file-log-level info
                Restart=always
                RestartSec=3
                LimitNOFILE=1048576

                [Install]
                WantedBy=multi-user.target
                SERVICE

                systemctl daemon-reload
                systemctl enable --now easytier.service
                sleep 5
                systemctl --no-pager --full status easytier.service || true

          runcmd:
            - systemctl daemon-reload
            - systemctl enable --now ssh
            - /opt/install-easytier.sh
            - rm -f /opt/install-easytier.sh
          '''

          Path(out).write_text(text, encoding='utf-8')
          Path(f'{Path(out).parent}/meta-data').write_text(
              'instance-id: cst-debian\nlocal-hostname: cst-debian\n',
              encoding='utf-8'
          )
          Path(f'{Path(out).parent}/network-config').write_text('''version: 2
ethernets:
  ens3:
    dhcp4: true
''', encoding='utf-8')
          PY

          cloud-localds \
            --network-config="$VM_DIR/seed/network-config" \
            "$VM_DIR/seed.iso" \
            "$VM_DIR/seed/user-data" \
            "$VM_DIR/seed/meta-data"

          chmod 600 "$VM_DIR/seed/user-data"
          echo 'Cloud-init seed ISO created.'

      - name: 6. Boot Debian VM with QEMU/KVM
        shell: bash
        run: |
          set -euo pipefail
          cd "$VM_DIR"

          # QEMU user-mode NAT：
          #   guest -> Internet：可用
          #   host:22222 -> guest:22：用于 Actions 自身检查 VM
          #   EasyTier 的 TCP/UDP 出站连接由 guest NAT 发出
          #   EasyTier 虚拟网卡则在 guest 内部建立
          nohup qemu-system-x86_64 \
            -name "$VM_NAME" \
            -machine q35,accel=kvm \
            -enable-kvm \
            -cpu host \
            -smp 2 \
            -m 4096 \
            -drive file="$VM_DIR/debian.qcow2",if=virtio,format=qcow2,cache=writeback \
            -drive file="$VM_DIR/seed.iso",media=cdrom,readonly=on \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:${VM_SSH_PORT}-:22 \
            -device virtio-net-pci,netdev=net0 \
            -nographic \
            -serial file="$VM_DIR/serial.log" \
            -monitor unix:"$VM_DIR/qemu-monitor.sock",server=on,wait=off \
            >"$VM_DIR/qemu.log" 2>&1 &

          echo $! > "$VM_DIR/qemu.pid"
          echo "QEMU PID: $(cat "$VM_DIR/qemu.pid")"
          sleep 5

          if ! kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null; then
            echo 'ERROR: QEMU exited during startup.'
            cat "$VM_DIR/qemu.log" || true
            exit 1
          fi

          echo 'Debian QEMU/KVM VM started.'

      - name: 7. Wait for Debian cloud-init and EasyTier
        shell: bash
        run: |
          set -euo pipefail

          SSH_OPTS=(
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=5
            -o ConnectionAttempts=2
          )

          PASSWORD="${DEBIAN_ROOT_PASSWORD:-CstDebian@2026!}"

          echo 'Waiting for Debian SSH...'
          for i in $(seq 1 90); do
            if command -v sshpass >/dev/null 2>&1; then
              if SSHPASS="$PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" -p "$VM_SSH_PORT" root@127.0.0.1 'echo SSH_OK' 2>/dev/null; then
                break
              fi
            else
              if sudo apt-get install -y sshpass >/dev/null 2>&1 && SSHPASS="$PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" -p "$VM_SSH_PORT" root@127.0.0.1 'echo SSH_OK' 2>/dev/null; then
                break
              fi
            fi
            if [[ "$i" -eq 90 ]]; then
              echo 'ERROR: Debian SSH did not become ready.'
              tail -n 160 "$VM_DIR/serial.log" 2>/dev/null || true
              tail -n 160 "$VM_DIR/qemu.log" 2>/dev/null || true
              exit 1
            fi
            sleep 4
          done

          echo 'Debian SSH is ready.'
          echo 'Waiting for EasyTier virtual IP...'

          ET_IP=''
          for i in $(seq 1 60); do
            out="$(SSHPASS="$PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" -p "$VM_SSH_PORT" root@127.0.0.1 'systemctl is-active easytier.service 2>/dev/null || true; /opt/easytier/easytier-cli --rpc-portal 127.0.0.1:15888 node 2>&1 || true; ip -4 addr show 2>/dev/null | grep -E "inet 10\\." || true' 2>/dev/null || true)"
            echo "[$i/60] $out"

            ET_IP="$(printf '%s\n' "$out" | sed -nE 's/.*Virtual IP[[:space:]]*\|[[:space:]]*([0-9]+(\.[0-9]+){3}).*/\1/p' | head -n1)"
            if [[ -z "$ET_IP" ]]; then
              ET_IP="$(printf '%s\n' "$out" | sed -nE 's/.*inet (10\.[0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n1)"
            fi

            if [[ -n "$ET_IP" && "$ET_IP" != '0.0.0.0' ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$ET_IP" ]]; then
            echo 'ERROR: EasyTier virtual IP was not detected.'
            SSHPASS="$PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" -p "$VM_SSH_PORT" root@127.0.0.1 \
              'systemctl --no-pager --full status easytier.service || true; journalctl -u easytier.service --no-pager -n 160 || true; ip -4 addr || true' || true
            exit 1
          fi

          echo "EASYTIER_IP=$ET_IP" >> "$GITHUB_ENV"
          echo
          echo '============================================================'
          echo '              DEBIAN QEMU/KVM IS READY'
          echo '============================================================'
          echo "Debian version : $(SSHPASS="$PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" -p "$VM_SSH_PORT" root@127.0.0.1 'cat /etc/debian_version')"
          echo "EasyTier IP    : $ET_IP"
          echo 'SSH port       : 22'
          echo 'SSH user       : root'
          echo 'SSH password   : [Repository Secret DEBIAN_ROOT_PASSWORD]'
          echo "QEMU host port : $VM_SSH_PORT (Actions-local diagnostic only)"
          echo '============================================================'

      - name: 8. Verify EasyTier peer and Debian network
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="${DEBIAN_ROOT_PASSWORD:-CstDebian@2026!}"
          SSH_OPTS=(
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=5
          )

          SSHPASS="$PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" -p "$VM_SSH_PORT" root@127.0.0.1 \
            'echo "===== Debian ====="; uname -a; cat /etc/os-release; echo "===== Network ====="; ip -4 addr; ip route; echo "===== EasyTier ====="; /opt/easytier/easytier-cli --rpc-portal 127.0.0.1:15888 node || true; /opt/easytier/easytier-cli --rpc-portal 127.0.0.1:15888 peer || true; echo "===== Services ====="; systemctl is-active ssh; systemctl is-active easytier.service'

      - name: 9. Keep Debian VM + EasyTier alive for up to 6 hours
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="${DEBIAN_ROOT_PASSWORD:-CstDebian@2026!}"
          SSH_OPTS=(
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=5
          )

          echo 'Debian QEMU/KVM VM will remain online for up to 6 hours.'
          echo 'The VM is reachable from other EasyTier nodes through its EasyTier virtual IP.'

          for i in $(seq 1 360); do
            if ! kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null; then
              echo 'ERROR: QEMU VM stopped unexpectedly.'
              tail -n 120 "$VM_DIR/qemu.log" 2>/dev/null || true
              exit 1
            fi

            status="$(SSHPASS="$PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" -p "$VM_SSH_PORT" root@127.0.0.1 'systemctl is-active easytier.service 2>/dev/null || true' 2>/dev/null || true)"
            if [[ "$status" != 'active' ]]; then
              echo "[$i/360] EasyTier inactive; restarting inside Debian."
              SSHPASS="$PASSWORD" sshpass -e ssh "${SSH_OPTS[@]}" -p "$VM_SSH_PORT" root@127.0.0.1 'systemctl restart easytier.service'
            else
              echo "[$i/360] Debian VM running; EasyTier active; EasyTier IP=${EASYTIER_IP}"
            fi

            sleep 60
          done

      - name: 10. Dump diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo '===== QEMU log ====='
          tail -n 240 "$VM_DIR/qemu.log" 2>/dev/null || true
          echo '===== Debian serial log ====='
          tail -n 240 "$VM_DIR/serial.log" 2>/dev/null || true
          echo '===== VM directory ====='
          ls -lah "$VM_DIR" 2>/dev/null || true

      - name: 11. Shutdown Debian VM
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -S "$VM_DIR/qemu-monitor.sock" ]]; then
            printf 'system_powerdown\n' | socat - UNIX-CONNECT:"$VM_DIR/qemu-monitor.sock" 2>/dev/null || true
          fi
          if [[ -f "$VM_DIR/qemu.pid" ]]; then
            kill "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null || true
          fi
          sleep 2
          pkill -f 'qemu-system-x86_64.*cst-debian' 2>/dev/null || true
